  .es-mapprev{font-size:12px;line-height:1.6;color:var(--ink-2);font-weight:600;background:var(--bg);border-radius:10px;padding:9px 11px;margin:2px 0 6px 9px;max-height:190px;overflow:auto}
  /* a finished paragraph is a state, not an empty box under the last label */
  .es-done{border:1.5px solid var(--green);border-radius:14px;background:var(--green-soft);padding:14px 16px;margin-top:12px}
  .es-doneh{display:flex;align-items:center;gap:9px;font-family:var(--disp);font-weight:600;font-size:15.5px;color:var(--ink)}
  .es-donetick{display:flex;color:var(--green-dk)}
  .es-donetick .es-ico{width:17px;height:17px}
  .es-donew{margin-left:auto;font-size:12px;font-weight:700;color:var(--green-dk)}
  .es-donesub{font-size:12.5px;line-height:1.55;font-weight:600;color:var(--ink-2);margin:6px 0 12px}
  .es-donebtns{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  /* reading the whole response, without leaving guided practice */
  .es-rvwrap{display:flex;flex-direction:column;gap:14px;max-width:820px;margin:0 auto}
  .es-rvh{font-family:var(--disp);font-weight:600;font-size:20px;color:var(--ink)}
  .es-rvsub{font-size:13px;line-height:1.55;color:var(--ink-2);font-weight:600;margin-top:5px}
  .es-rvsec{border:1.5px solid var(--line);border-radius:16px;background:var(--card);padding:14px 18px}
  .es-rvsec.empty{border-style:dashed;background:none}
  .es-rvsech{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;margin-bottom:8px}
  .es-rvrole{font-family:var(--disp);font-weight:600;font-size:14px;color:var(--ink)}
  .es-rvarg{font-size:12px;font-weight:700;color:var(--green-dk);background:var(--green-soft);border-radius:99px;padding:3px 10px;max-width:min(46ch,100%);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .es-rvw{font-size:11.5px;font-weight:700;color:var(--ink-3);margin-left:auto}
  .es-rvtext{font-size:15px;line-height:1.75;color:var(--ink);font-weight:600}
  .es-rvempty{font-size:13px;font-weight:600;color:var(--ink-3);font-style:italic}

  .es-compose{min-width:0}
  .es-parahead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:10px}
  .es-progrow{display:flex;gap:12px;flex-wrap:wrap}
  .es-prog{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3)}
  .es-prog.done{color:var(--green-dk)}
  .es-prog.now{color:var(--ink)}
  .es-progdot{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .es-prog.done .es-progdot{background:var(--green)}
  .es-prog.now .es-progdot{background:var(--green);box-shadow:0 0 0 3px rgba(28,196,125,.25)}
  .es-flow{border:1.5px solid var(--line);border-radius:16px;background:var(--card);padding:18px 20px}
  .es-prose{font-size:16.5px;line-height:1.85;color:var(--ink)}
  /* "Your paragraph builds here, one sentence at a time" described a mechanism the
     student watches happen on the next press, directly above the box that already
     says "Type your next sentence". Two strings for one action; the node stays so
     nothing that reads .es-prose breaks. */
  .es-prose.empty{display:none}
  .es-said{border-radius:4px;cursor:pointer;transition:background .12s}
  .es-said:hover{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold-soft)}
  .es-active{margin-top:14px}
  /* The writing is the task, so it gets the vertical space the scaffolding used to.
     It still grows with the student's sentence. */
  .es-linebox{width:100%;font-size:16.5px;line-height:1.7;resize:vertical;min-height:200px}
  .es-editrow{margin:8px 0}
  .es-linebtns{display:flex;gap:10px;align-items:center;margin-top:7px}
  .es-del{color:var(--coral-dk)}
  .es-guide{margin:0 0 12px;border-left:3px solid var(--green);padding:2px 0 2px 13px}
  .es-guideh{font-family:var(--disp);font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--green-dk)}
  /* The instruction now leads the writing rather than trailing it, so it is the
     largest text in the composer. Nothing else here is 17px at 700. */
  .es-guidejob{font-size:17px;font-weight:700;line-height:1.5;color:var(--ink);margin-top:3px}
  .es-shapebtn{margin-top:7px;display:inline-block}
  .es-shapes{margin-top:7px;display:flex;flex-direction:column;gap:5px}
  .es-shape{font-size:13.5px;line-height:1.6;color:var(--ink-2);margin:0;
    background:var(--bg);border-radius:8px;padding:7px 10px}
  .es-guidectx{font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:4px}
  .es-help{margin-top:12px}
  .es-rung{display:flex;gap:11px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:10px 13px;margin-bottom:8px;background:#FBFDFD}
  .es-rungn{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;font-size:11.5px;font-weight:800;flex:none;margin-top:1px}
  .es-runglbl{font-family:var(--disp);font-weight:600;font-size:12px;color:var(--ink-2)}
  .es-rungtext{font-size:14px;line-height:1.6;color:var(--ink);margin-top:2px}
  .es-rungtext.frame,.es-rungtext.starter{font-style:italic;font-size:15px;line-height:1.7}
  .es-rungtext.example{font-size:14.5px;line-height:1.7;color:var(--ink)}
  .es-hole{display:inline-block;font-style:normal;font-size:12px;font-weight:700;color:var(--ink-2);background:var(--gold-soft);border-radius:5px;padding:1px 7px;margin:0 2px}
  .es-rungctx{font-size:11px;font-weight:800;color:var(--ink-3);text-transform:none;letter-spacing:0}
  .es-rung.example{border-color:var(--green)}
  .es-helpend{font-size:12.5px;font-weight:700;color:var(--ink-2)}
  .es-rungnote{font-size:12px;font-weight:700;color:var(--green-dk);margin-top:5px}
  .es-helpbtns{display:flex;gap:11px;align-items:center;flex-wrap:wrap}
  .es-linerow{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:16px}
  .es-linerow .es-spacer{flex:1}
  .es-linerow .es-linkbtn[disabled]{opacity:.4;pointer-events:none}
  .es-btn.sm{padding:7px 13px;font-size:13px}
  /* Narrower still: the response map collapses first, the composer stays readable. */
  @media(max-width:1000px){.es-cols{grid-template-columns:minmax(0,1fr)}.es-map{position:static;flex-direction:row;flex-wrap:wrap}.es-margin{order:3}}

  /* ===== Marking rebuild: where to start, and the way back into writing ===== */
  .rv-focus{border:1.5px solid var(--green);border-radius:16px;background:var(--green-soft);padding:14px 16px;margin-bottom:16px}
  .rv-focushead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .rv-focustag{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--green-dk);border-radius:999px;padding:3px 9px}
  .rv-focusarea{font-family:var(--disp);font-weight:600;font-size:16px;color:var(--ink)}
  .rv-focuswhy{font-size:13.5px;line-height:1.55;color:var(--ink);margin-top:8px}
  .rv-focusquote{font-size:13px;line-height:1.55;color:var(--ink);margin-top:7px;padding-left:11px;border-left:3px solid var(--green);font-style:italic}
  .rv-focusrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
  .rv-credited{font-size:12.5px;line-height:1.5;color:var(--ink);margin-top:10px;padding-top:9px;border-top:1px solid rgba(28,196,125,.35)}
  .rv-credited b{color:var(--green-dk)}
  .rv-scorecard{margin-top:16px;border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;background:#fff}
  .rv-screasons{margin-top:6px}
  .rv-statusrow{width:100%;display:flex;align-items:center;gap:11px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-family:var(--body)}
  .rv-statusrow:hover{border-color:var(--ink-3)}
  .rv-strdot{flex:none;width:11px;height:11px;border-radius:50%}
  .rv-strdot.critical{background:var(--coral)} .rv-strdot.should{background:var(--gold)} .rv-strdot.optional{background:var(--blue)}
  .rv-strtext{flex:1;font-size:14.5px;font-weight:600;color:var(--ink)}
  .rv-statusrow.done .rv-strtext{color:var(--ink-2)}
  .rv-stbadge{flex:none;font-family:var(--disp);font-weight:600;font-size:11.5px;padding:3px 10px;border-radius:8px;color:#fff}
  .rv-stbadge.open.critical{background:var(--coral)} .rv-stbadge.open.should{background:var(--gold-dk)} .rv-stbadge.open.optional{background:var(--blue)}
  .rv-stbadge.done{background:var(--green)}
  .rv-stbadge.skip{background:var(--ink-3)}

  /* issue walkthrough (navigation skeleton; ladders + practice land in step 5) */
  .rv-focusbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
  .rv-backbtn{font-family:var(--disp);font-weight:600;font-size:13px;color:var(--blue-dk);background:#fff;border:1.5px solid var(--blue);border-radius:10px;cursor:pointer;padding:7px 14px}
  .rv-backbtn:hover{background:var(--blue-soft)}
  .rv-focusprog{font-family:var(--disp);font-weight:600;font-size:13px;color:var(--ink-2)}
  .rv-chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .rv-ichip{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-family:var(--disp);font-weight:600;font-size:13px;color:var(--ink-2);display:grid;place-items:center}
  .rv-ichip.critical{border-color:var(--coral)} .rv-ichip.should{border-color:var(--gold)} .rv-ichip.optional{border-color:var(--blue)}
  .rv-ichip.done{background:var(--green);color:#fff;border-color:var(--green)}
  .rv-ichip.skip{background:var(--bg);color:var(--ink-3)}
  .rv-ichip.cur{box-shadow:0 0 0 3px var(--blue-soft);border-color:var(--blue)}
  .rv-issuecard{border:2px solid var(--blue);border-radius:16px;padding:16px 18px;background:#fff}
  .rv-issuecard.sev-critical{border-color:var(--coral-dk)} .rv-issuecard.sev-should{border-color:var(--gold-dk)} .rv-issuecard.sev-optional{border-color:var(--blue)}
  .rv-issuehead{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .rv-sevtag{font-family:var(--disp);font-weight:600;font-size:11px;color:#fff;padding:3px 11px;border-radius:8px}
  .rv-sevtag.critical{background:var(--coral-dk)} .rv-sevtag.should{background:var(--gold-dk)} .rv-sevtag.optional{background:var(--blue)}
  .rv-subprog{font-size:12px;color:var(--ink-2);font-weight:700}
  .rv-origtag{display:inline-block;font-size:12.5px;color:var(--ink-2);font-weight:700;margin-bottom:8px}
  .rv-origline{font-size:16.5px;line-height:1.7;color:var(--ink);font-weight:600;background:var(--bg);border:1.5px solid var(--line);border-radius:11px;padding:12px 15px;margin-bottom:13px}
  .rv-issuetitle{font-family:var(--disp);font-weight:600;font-size:18px;color:var(--ink);margin-bottom:6px}
  .rv-issuewhy{font-size:16px;line-height:1.65;color:var(--ink);font-weight:600;margin-bottom:15px}
  .rv-issuebtns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .rv-skipbtn{color:var(--ink-2)}

  /* step 8: charting module (Lorenz + Gini), reused from the verified prototype */
  .lzwrap{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;margin-bottom:12px}
  .lzcap{font-size:13px;font-weight:700;color:var(--ink);margin:2px 4px 8px}
  .lzexpand{position:absolute;top:12px;right:12px;font-family:var(--disp);font-weight:600;font-size:12px;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:5px 10px;cursor:pointer;color:var(--ink-2)}
  .lzexpand:hover{border-color:var(--blue);color:var(--blue-dk)}
  .lzsvg{width:100%;max-width:460px;height:auto;display:block;margin:0 auto}
  .lzsvg-big{max-width:620px}
  .lzgrid{stroke:var(--line);stroke-width:1}
  .lzaxis{stroke:var(--ink-3);stroke-width:1.5}
  .lzaxlab{font-family:var(--body);font-weight:700;font-size:12px;fill:var(--ink-2)}
  .lzaxnum{font-family:var(--body);font-weight:700;font-size:10.5px;fill:var(--ink-3)}
  .lztitle{font-family:var(--disp);font-weight:600;font-size:15px;fill:var(--ink)}
  .lzeq{stroke:var(--ink-3);stroke-width:2;stroke-dasharray:5 5;fill:none}
  .lzgross{stroke:var(--coral);stroke-width:3;fill:none;stroke-linejoin:round}
  .lzdisp{stroke:var(--green);stroke-width:3;fill:none;stroke-linejoin:round}
  .lzwealth{stroke:var(--gold-dk);stroke-width:3;fill:none;stroke-linejoin:round}
  .lzgap{fill:var(--green-soft);opacity:.55}
  .lzleglab{font-family:var(--body);font-weight:700;font-size:11.5px;fill:var(--ink)}
  .lzpoi{cursor:pointer}
  .lzpoidot{fill:var(--blue)}
  .lzpoiring{fill:none;stroke:var(--blue);stroke-width:2;opacity:.35}
  .lzpoi:hover .lzpoiring{opacity:.9;stroke:var(--blue-dk)}
  .lzexplain{margin-top:12px;background:var(--bg);border-radius:12px;padding:13px 15px;min-height:54px}
  .lzhint{font-size:13px;color:var(--ink-2);font-weight:700}
  .lzexp-t{font-family:var(--disp);font-weight:600;font-size:14.5px;color:var(--blue-dk);margin-bottom:4px}
  .lzexp-b{font-size:13.5px;line-height:1.6;color:var(--ink)}
  .lzbigscrim{position:fixed;inset:0;background:rgba(28,40,40,.6);display:none;align-items:center;justify-content:center;z-index:170;padding:24px}
  .lzbigscrim.show{display:flex}
  .lzbigcard{position:relative;background:#fff;border-radius:20px;max-width:1000px;width:100%;max-height:88vh;overflow:auto;padding:26px}
  .lzbiggrid{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
  @media(max-width:760px){.lzbiggrid{grid-template-columns:1fr}}
  .lzbigside{background:var(--bg);border-radius:14px;padding:16px 18px}
  /* income-source bar */
  .srcbar{display:flex;flex-direction:column;gap:9px;margin-top:4px}
  .srcrow{display:grid;grid-template-columns:150px 1fr 46px;align-items:center;gap:10px}
  .srclab{font-size:13px;font-weight:700;color:var(--ink);text-align:right}
  .srctrack{display:block;height:20px;background:var(--bg);border-radius:6px;overflow:hidden}
  .srcfill{display:block;height:100%;border-radius:6px;background:var(--blue);min-width:2px}
  .srcpct{font-family:var(--disp);font-weight:600;font-size:13px;color:var(--ink)}
  /* Gini "how it's built" tool */
  .giniA{fill:var(--coral);opacity:.32} .giniB{fill:var(--blue);opacity:.16}
  .ginilbl{font-family:var(--disp);font-weight:600;font-size:20px} .ginilblA{fill:var(--coral-dk)} .ginilblB{fill:var(--blue-dk)}
  .ginihead{font-family:var(--disp);font-weight:600;font-size:15px;color:var(--ink);margin-bottom:6px}
  .giniframe{font-size:12.5px;line-height:1.55;color:var(--ink);background:var(--blue-soft);border-radius:10px;padding:9px 11px;margin:0 0 12px}
  .giniframe b{color:var(--blue-dk);font-weight:800}
  .ginicurvesel{display:flex;gap:6px;margin-bottom:10px}
  .ginicurvesel button{flex:1;font-family:var(--disp);font-weight:600;font-size:13px;border:1.5px solid var(--line);border-radius:10px;padding:7px;background:#fff;cursor:pointer;color:var(--ink-2)}
  .ginicurvesel button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-dk)}
  .ginistepnote{font-size:13px;color:var(--ink);font-weight:500;margin:0 0 10px}
  .ginistep{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;line-height:1.5;color:var(--ink-2);padding:8px 0;border-top:1px solid var(--line)}
  .ginistep.on{color:var(--ink)}
  .ginistep .gn{flex:none;width:20px;height:20px;border-radius:50%;background:var(--ink-3);color:#fff;font-family:var(--disp);font-weight:600;font-size:11px;display:grid;place-items:center}
  .ginistep.on .gn{background:var(--blue)}
  .ginival{font-family:var(--disp);font-weight:600;color:var(--blue-dk)} .ginival.big{font-size:17px}
  .ginidone{font-size:13px;line-height:1.55;color:var(--ink);background:var(--green-soft);border-radius:10px;padding:10px 12px;margin:8px 0 0}
  /* ===== long-answer question page (toned-down: white/grey, green submit only) ===== */
  .qmeta{font-family:var(--disp);font-weight:500;font-size:12.5px;color:var(--ink-3);margin:0 0 8px}
  .qcard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px}
  .qprompt{font-family:var(--disp);font-weight:500;font-size:20px;line-height:1.45;color:var(--ink)}
  .qtoggles{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .qtoggle{font-family:var(--disp);font-weight:600;font-size:14px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .qtoggle:hover{border-color:var(--ink-3)}
  .qtoggle .ti{color:var(--ink-3);font-style:normal}
  .qtoggle.on-source{border-color:var(--blue);color:var(--blue-dk)} .qtoggle.on-source .ti{color:var(--blue)}
  .qtoggle.on-help{border-color:var(--gold-dk);color:var(--gold-dk)} .qtoggle.on-help .ti{color:var(--gold-dk)}
  /* help panel: scaffold + hint under one roof */
  .helppanel{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:18px}
  .helpsec{margin-bottom:14px} .helpsec:last-child{margin-bottom:0}
  .helph{font-family:var(--disp);font-weight:600;font-size:13.5px;color:var(--ink-2);margin-bottom:8px}
  .helpol{margin:0 0 0 18px;padding:0} .helpol li{font-size:14.5px;line-height:1.6;color:var(--ink);margin-bottom:5px;font-weight:600}
  /* work area: answer left, source right, equal height when shown */
  .qwork{display:grid;grid-template-columns:1fr;gap:18px;align-items:stretch}
  .qwork.with-source{grid-template-columns:1fr 1fr;height:480px}
  .qmain{min-width:0;display:flex;flex-direction:column}
  .qwork.with-source .qmain,.qwork.with-source #answerzone,.qwork.with-source .answerbox{height:100%}
  #answerzone{flex:1;min-height:0}
  .sourcepanel{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;min-height:0}
  .sourcepanel[hidden]{display:none}
  .sphead{font-family:var(--disp);font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;flex:none}
  .spbody{flex:1;overflow-y:auto;min-height:0}
  .spbody .lzsvg{max-width:340px}
  .lzfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
  .lzfoot .lzexplain{flex:1;margin:0;background:none;padding:0;min-height:0}
  .submitrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px}

  /* step 5: rewrite ladder + practice + live rebuild */
  .rv-ladder{margin:4px 0 2px}
  .rv-rung{display:flex;align-items:flex-start;gap:11px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left;font-family:var(--body)}
  .rv-rung:hover{border-color:var(--blue)}
  .rv-rung.chosen{border:2px solid var(--blue);background:var(--blue-soft);cursor:default}
  .rv-rlvl{flex:none;font-family:var(--disp);font-weight:600;font-size:11px;padding:3px 9px;border-radius:8px;margin-top:1px;color:#fff}
  .rv-rlvl.a{background:var(--ink-3)} .rv-rlvl.b{background:var(--blue)} .rv-rlvl.c{background:var(--green)}
  .rv-rt{font-size:16px;line-height:1.6;color:var(--ink);font-weight:600}
  .rv-laddertip{font-size:12.5px;color:var(--ink-2);font-weight:600;margin:9px 2px 2px;line-height:1.5}
  .rv-pickother{display:inline-block;margin:10px 0 12px;font-family:var(--disp);font-weight:600;font-size:13px;color:var(--blue-dk);background:#fff;border:1.5px solid var(--blue);border-radius:10px;cursor:pointer;padding:7px 14px}
  .rv-pickother:hover{background:var(--blue-soft)}
  .rv-practice{margin-top:6px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:15px}
  .rv-repdots{display:flex;gap:6px;margin-bottom:9px}
  .rv-repdot{width:9px;height:9px;border-radius:50%;background:var(--ink-3)}
  .rv-repdot.on{background:var(--green)}
  .rv-starter{font-size:15.5px;line-height:1.7;color:var(--ink);font-weight:600;margin:0 0 9px}
  .rv-starter b{color:var(--blue-dk);font-weight:800;letter-spacing:.5px}
  .rv-pinput{width:100%;border:1.5px solid var(--blue);border-radius:11px;padding:10px 12px;font-family:var(--body);font-size:14.5px;line-height:1.6;color:var(--ink);resize:vertical;min-height:46px}
  .rv-pinput:focus{outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
  .rv-soft{font-size:12.5px;font-weight:700;line-height:1.45;min-height:16px;margin:8px 2px 0}
  .rv-soft.warn{color:var(--gold-dk)} .rv-soft.ok{color:var(--green-dk)}
  .rv-prow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .rv-freshlabel{font-family:var(--disp);font-weight:600;font-size:12.5px;color:var(--blue-dk);margin:14px 0 6px}
  .rv-rebuilt{margin-top:16px;border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;background:#fff}
  .rv-rebuilttoggle{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:none;cursor:pointer;font-family:var(--disp);font-weight:600;font-size:13px;color:var(--green-dk);padding:4px 2px}
  .rv-rbchev{color:var(--ink-3);font-size:12px}
  .rv-rwout{border:1.5px solid var(--line);border-radius:13px;padding:14px 16px;background:#fff;font-size:15px;line-height:1.85;margin-top:10px}
  .rv-rwout .rv-ln{display:block;margin-bottom:4px}
  .rv-rwout .rv-ln.kept{color:var(--ink)}
  .rv-rwout .rv-ln.fixed{color:var(--ink);background:var(--green-soft);border-radius:4px;padding:0 3px}
  .rv-rwout .rv-ln.pending{color:var(--ink-2)}
  .rv-rwout .rv-rwempty{color:var(--ink-3);font-style:italic}
  .rv-miniok{font-size:12.5px;color:var(--green-dk);font-weight:800;margin-top:8px}

  /* ===== Essay practice mode (behind essayMode / ?essaydemo). White surfaces,
     strong ink, the single green accent, sentence case, no em-dashes. ===== */
  body.es-lock{overflow:hidden}
  /* THE ESSAY IS A PAGE. It was a modal: a dimmed application behind a rounded
     card, which is the right shape for a task that lasts a moment and the wrong
     one for a task that lasts an hour. Writing 800 words, moving between
     sections, consulting material and reviewing the whole response is not a
     temporary interruption to the flashcards, it is the work. So the surface is
     opaque, square, full width and does not float: no scrim colour, no card
     radius, no shadow, no entrance animation. Nothing shows through, because
     there is nothing behind it any more. */
  .es-scrim{position:fixed;inset:0;background:var(--bg);display:block;padding:0;overflow:auto;z-index:120}
  .es-shell{width:100%;max-width:none}
  .es-wrap{background:transparent;border-radius:0;box-shadow:none;padding:0 0 40px}
  /* The header is the application's, so it stays put and reads as one: full
     bleed, sticky, its contents centred on the same column as the page body.
     No wrapper element, so every screen that renders .es-top gets it. */
  .es-wrap > *{max-width:min(1420px,96vw);margin-left:auto;margin-right:auto}
  .es-wrap > .es-top{max-width:none;position:sticky;top:0;z-index:6;background:var(--card);
    border-bottom:1px solid var(--line);margin-bottom:20px;
    padding:13px max(clamp(16px,3vw,28px),calc((100% - min(1420px,96vw))/2))}
  .es-shell:has(.es-wide){max-width:1040px}
  /* the composer takes the canvas: the writing has to be the dominant thing on screen */
  .es-shell:has(.es-canvas){max-width:min(1480px,94vw)}
  .es-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .es-brand{font-family:var(--disp);font-weight:600;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .es-subj{font-size:12.5px;font-weight:700;color:var(--ink-2)}
  .es-demobadge{font-family:var(--disp);font-weight:600;font-size:11px;color:var(--green-dk);background:var(--green-soft);border-radius:99px;padding:2px 10px}
  .es-topbtns{display:flex;align-items:center;gap:10px;flex:none}
  .es-x{background:none;border:none;font-family:var(--disp);font-weight:600;font-size:13px;color:var(--ink-2);padding:6px 12px;border-radius:10px;cursor:pointer}
  .es-x:hover{background:var(--green-soft);color:var(--green-dk)}
  .es-h1{font-family:var(--disp);font-weight:600;font-size:24px;color:var(--ink);margin-bottom:6px}
  .es-lead{font-size:14px;color:var(--ink-2);font-weight:600;margin-bottom:18px;line-height:1.55}
  .es-empty{text-align:center;padding:30px 10px 18px}
  .es-field{margin-bottom:18px}
  .es-label{display:block;font-family:var(--disp);font-weight:600;font-size:13.5px;color:var(--ink);margin-bottom:7px}
  .es-req{font-size:11px;font-weight:700;color:var(--green-dk);background:var(--green-soft);border-radius:99px;padding:2px 9px;margin-left:6px}
  .es-opt{font-size:11px;font-weight:700;color:var(--ink-3);margin-left:6px}
  .es-input{width:100%;font:inherit;font-weight:600;font-size:15px;line-height:1.6;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 14px}
  .es-input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .es-ta{resize:vertical;min-height:64px}
  .es-select{font-family:var(--body);cursor:pointer}
  .es-help{font-size:12.5px;color:var(--ink-2);font-weight:600;line-height:1.5;margin:9px 0 7px}
  .es-qchips{display:flex;flex-direction:column;gap:8px}
  .es-qchip{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:10px 13px;font:inherit;font-weight:600;font-size:13.5px;color:var(--ink);line-height:1.45;cursor:pointer;transition:border-color .12s}
  .es-qchip:hover{border-color:var(--green)}
  .es-qcmd{font-family:var(--disp);font-weight:600;color:var(--green-dk);font-size:12.5px;margin-right:4px}
  .es-linkbtn{background:none;border:none;font-family:var(--disp);font-weight:600;font-size:13px;color:var(--green-dk);cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
  .es-linkbtn:hover{color:var(--green)}
  .es-bands{margin-top:10px;border:1.5px solid var(--line);border-radius:13px;overflow:hidden}
  .es-band{display:flex;gap:12px;padding:10px 13px;border-top:1px solid var(--line)}
  .es-band:first-child{border-top:none}
  .es-bandr{font-family:var(--disp);font-weight:600;font-size:12.5px;color:var(--green-dk);flex:none;width:96px}
  .es-bandt{font-size:12.5px;color:var(--ink-2);font-weight:600;line-height:1.5}
  .es-resume{margin-bottom:20px}
  .es-reslist{display:flex;flex-direction:column;gap:8px}
  .es-resitem{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:10px 13px}
  .es-resmain{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 auto}
  .es-restoplabel{font-family:var(--disp);font-weight:600;font-size:11.5px;color:var(--green-dk);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .es-resq{font-size:13px;color:var(--ink);font-weight:600;line-height:1.4}
  .es-resmeta{font-size:11.5px;color:var(--ink-3);font-weight:700}
  .es-resactions{display:flex;gap:7px;flex-wrap:wrap;align-items:center;flex:none}
  .es-resdel{font:inherit;font-weight:700;font-size:12px;color:var(--ink-2);background:none;border:none;cursor:pointer;padding:4px 6px;text-decoration:underline;text-underline-offset:2px}
  .es-resdel:hover{color:var(--coral-dk)}
  .es-restag{font-family:var(--disp);font-weight:600;font-size:11.5px;color:var(--green-dk);background:var(--green-soft);border-radius:99px;padding:3px 11px}
  .es-restag.muted{color:var(--ink-3);background:#F2F6F6}
  .es-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px}
  .es-btn{font-family:var(--disp);font-weight:600;font-size:15px;color:#fff;background:var(--green);border:none;border-radius:14px;padding:12px 24px;box-shadow:0 4px 0 var(--green-dk);cursor:pointer;transition:transform .08s}
  .es-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-dk)}
  .es-btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 0 0 2px var(--line) inset}
  .es-btn.ghost:hover:not(:disabled){box-shadow:0 0 0 2px var(--green) inset}
  .es-btn:disabled{opacity:.5;cursor:default;box-shadow:0 0 0 2px var(--line) inset}
  .es-foothint{font-size:12.5px;color:var(--ink-3);font-weight:600}
  .es-qbar{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;background:var(--card);border:1.5px solid var(--line);border-left:4px solid var(--green);border-radius:14px;padding:12px 16px;margin-bottom:16px}
  .es-qbar-mode{font-family:var(--disp);font-weight:600;font-size:11.5px;color:var(--green-dk);text-transform:lowercase;margin-bottom:3px}
  .es-qbar-q{font-size:14.5px;color:var(--ink);font-weight:700;line-height:1.45}
  .es-stepper{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
  .es-steps{display:flex;gap:8px;flex-wrap:wrap}
  .es-step{display:flex;align-items:center;gap:7px;background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:5px 12px 5px 6px;color:var(--ink-3)}
  .es-step.on{border-color:var(--green);color:var(--ink);background:var(--green-soft)}
  .es-step.done .es-stepn{background:var(--green);color:#fff}
  .es-stepn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-weight:600;font-size:12px;background:#EEF3F3;color:var(--ink-2)}
  .es-step.on .es-stepn{background:var(--green);color:#fff}
  .es-steplbl{font-family:var(--disp);font-weight:600;font-size:12px}
  .es-ring{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);color:var(--green-dk);font-family:var(--disp);font-weight:600;font-size:15px;border:2px solid var(--green)}
  .es-coachcols{display:flex;gap:20px;align-items:flex-start}
  .es-coachmain{flex:1 1 auto;min-width:0}
  .es-margin{flex:0 0 320px;max-width:320px}
  .es-pointpin{margin-bottom:12px}
  .es-pinlabel{display:block;font-family:var(--disp);font-weight:600;font-size:12px;color:var(--ink-3);margin-bottom:5px}
  .es-pointin{width:100%;font:inherit;font-weight:600;font-size:13.5px;color:var(--ink-2);background:#FAFCFC;border:1.5px dashed var(--line);border-radius:11px;padding:8px 12px}
  .es-pointin:focus{outline:none;border-color:var(--green);border-style:solid;color:var(--ink);box-shadow:0 0 0 3px var(--green-soft)}
  .es-pararole{font-family:var(--disp);font-weight:600;font-size:13px;color:var(--green-dk);margin-bottom:7px}
  .es-parabox{min-height:240px;resize:vertical}
  .es-navrow{display:flex;align-items:center;gap:10px;margin-top:14px}
  .es-navrow .es-btn{padding:10px 20px;font-size:14px}
  .es-cooldown{font-size:12.5px;color:var(--ink-2);font-weight:600;line-height:1.5;margin-top:10px;background:#FAFCFC;border-left:3px solid var(--green);border-radius:6px;padding:9px 12px}
  .es-margin{position:sticky;top:8px}
  .es-mempty{font-size:13px;color:var(--ink-2);font-weight:600;line-height:1.55;background:#FAFCFC;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
  .es-demonote{font-size:12px;color:var(--green-dk);font-weight:700;background:var(--card);border:1.5px solid var(--green);border-radius:11px;padding:8px 12px;margin-bottom:12px;line-height:1.45}
  .es-mnote{font-size:13.5px;color:var(--ink);font-weight:700;line-height:1.55;margin-bottom:14px}
  .es-mblock{margin-bottom:14px}
  .es-mh{font-family:var(--disp);font-weight:600;font-size:11.5px;color:var(--ink-3);text-transform:lowercase;margin-bottom:7px}
  .es-nudge{font-size:13px;color:var(--ink);font-weight:600;line-height:1.5;padding:9px 12px;border-left:3px solid var(--green);background:#FAFCFC;border-radius:6px;margin-bottom:8px}
  .es-chipline{margin-bottom:10px}
  .es-chipfrom{display:block;font-size:12px;color:var(--ink-2);font-weight:600;margin-bottom:5px}
  .es-chipopts{display:flex;gap:7px;flex-wrap:wrap}
  .es-chip{font:inherit;font-weight:700;font-size:12.5px;color:var(--green-dk);background:var(--card);border:1.5px solid var(--green);border-radius:99px;padding:5px 13px;cursor:pointer;transition:background .12s,color .12s}
  .es-chip:hover{background:var(--green);color:#fff}
  .es-check{font-size:12px;color:var(--ink-2);font-weight:600;font-style:italic;line-height:1.5;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .es-standing{font-size:13px;color:var(--ink-2);font-weight:600;line-height:1.5;margin-bottom:12px}
  .es-inlinelink{background:none;border:none;font:inherit;font-weight:700;color:var(--green-dk);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0}
  .es-inlinelink:hover{color:var(--green)}
  .es-fullbox{min-height:380px;resize:vertical;line-height:1.75}
  .es-coachstrip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:12px 0}
  .es-completion{margin-top:14px;border:1.5px solid var(--green);background:var(--card);border-radius:16px;padding:14px 18px}
  .es-completemsg{font-size:13.5px;color:var(--ink);font-weight:700;line-height:1.5;margin-bottom:12px}
  .es-completion .es-actions{margin-top:0}
  .es-marks{max-width:120px}
  .es-marked{display:block}
  .es-markhead{display:flex;align-items:baseline;gap:10px}
  .es-markscore{font-family:var(--disp);font-weight:700;font-size:30px;color:var(--green-dk);line-height:1}
  .es-markscore small{font-size:16px;color:var(--ink-3);font-weight:600}
  .es-markwhat{font-size:12.5px;color:var(--ink-2);font-weight:700}
  .es-markfocus{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .es-markarea{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-family:var(--disp);font-weight:600;font-size:15px;color:var(--ink)}
  .es-marktag{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--green-dk);border-radius:999px;padding:3px 9px}
  .es-markwhy{font-size:13.5px;line-height:1.55;color:var(--ink);margin-top:8px}
  .es-markquote{font-size:13px;line-height:1.55;color:var(--ink);margin-top:7px;padding-left:11px;border-left:3px solid var(--green);font-style:italic}
  .es-marked .es-actions{margin-top:14px}
  .es-submittedh{font-family:var(--disp);font-weight:600;font-size:16px;color:var(--green-dk);margin-bottom:6px}

  /* ===== Batch 2: missing-element cards, ghost frames, polish reveal, quiz ===== */
  .es-step.mastered{border-color:var(--green);background:var(--green-soft)}
  .es-step.mastered .es-stepn{background:var(--green);color:#fff}
  /* missing-element cards (margin) */
  .es-miss{border:1.5px solid var(--line);border-left:4px solid var(--green);border-radius:12px;padding:10px 12px;margin-bottom:9px;background:var(--card)}
  .es-missh{font-family:var(--disp);font-weight:600;font-size:13px;color:var(--green-dk);margin-bottom:3px}
  .es-missjob{font-size:12.5px;color:var(--ink);font-weight:600;line-height:1.5}
  /* pill button reused by the saved-essays list (Resume / Use as template) */
  .es-misstier{font:inherit;font-weight:700;font-size:12px;color:var(--green-dk);background:var(--card);border:1.5px solid var(--green);border-radius:99px;padding:4px 11px;cursor:pointer}
  .es-misstier:hover{background:var(--green);color:#fff}
  /* single scaffold toggle (margin) reveals the whole ordered skeleton at once */
  .es-scafftoggle{font:inherit;font-weight:700;font-size:12.5px;color:var(--green-dk);background:var(--card);border:1.5px solid var(--green);border-radius:99px;padding:5px 14px;cursor:pointer;margin-top:4px}
  .es-scafftoggle:hover{background:var(--green);color:#fff}
  .es-scaffhint{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:6px;line-height:1.4}
  /* ordered skeleton (writing column): solid = present, dashed = missing gap */
  .es-skelhost:empty{display:none}
  .es-skel{margin-top:12px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
  .es-skelh{font-family:var(--disp);font-weight:600;font-size:12.5px;color:var(--ink);line-height:1.55;margin-bottom:11px}
  .es-skelrow{border-radius:10px;padding:9px 12px;margin-bottom:8px;border:1.5px solid var(--line)}
  .es-skelrow:last-child{margin-bottom:0}
  .es-skelrow.have{background:#FBFBFB}
  .es-skeltop{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .es-skellabel{font-family:var(--disp);font-weight:700;font-size:12.5px;color:var(--green-dk)}
  .es-skelrow.have .es-skellabel::before{content:"\2713 ";color:var(--green)}
  .es-skelhave{font-size:12.5px;color:var(--ink-3);font-weight:600}
  /* the JOB this sentence has to do: the guidance itself, so it reads at full strength */
  .es-skeljob{font-size:13.5px;line-height:1.55;color:var(--ink);margin-top:3px}
  .es-skelrow.have .es-skeljob{color:var(--ink-2)}
  .es-skelask{font:inherit;font-weight:700;font-size:11.5px;color:var(--ink-2);background:none;border:none;padding:0;margin-left:auto;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .es-skelask:hover{color:var(--green-dk)}
  .es-skelframes{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
  .es-skelnote{font-size:11.5px;color:var(--ink-2);font-weight:600;margin-top:7px}
  .es-skel.graded .es-skelrow.gap{border:1.5px dashed var(--green);background:#FAFCFC}
  .es-skelgaplabel{font-family:var(--disp);font-weight:600;font-size:11px;color:var(--ink-3);text-transform:lowercase;margin-bottom:6px}
  .es-skelframe{font-size:14px;color:var(--ink);font-style:italic;line-height:1.7}
  /* the answer shape shown on a study card or inside a paper, outside essay mode */
  .ansshape{margin-top:14px}
  .ansshape .es-skelrow.gap{border:1.5px solid var(--line);background:#FBFDFD}
  .ansshape .es-skelnote{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
  .es-skelchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .es-skelchip{font:inherit;font-weight:700;font-size:11.5px;color:var(--ink-2);background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:3px 10px;cursor:pointer}
  .es-skelchip.on{color:var(--green-dk);border-color:var(--green);background:var(--green-soft)}
  .es-skelchip:hover{border-color:var(--green)}
  .es-evstatus{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px;letter-spacing:.02em}
  .es-evstatus.ok{background:var(--green-soft);color:var(--green-dk)}
  .es-evstatus.dated{background:var(--gold-soft);color:#7a5b16}
  .es-evsrct{display:block;margin-top:5px;font-size:11.5px;color:var(--ink-3)}
  .es-evsupports{font-size:12.5px;color:var(--ink-2);margin:7px 0 0}
  .es-evtag{display:inline-block;background:var(--green-soft);color:var(--green-dk);border-radius:5px;
    padding:1px 7px;font-size:12px;font-weight:700;margin-right:3px}
  .es-evwhy2{margin-top:8px}
  .es-evwhy2 > summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--green-dk);list-style:none}
  .es-evwhy2 > summary::-webkit-details-marker{display:none}
  .es-evwhy2 > summary::before{content:"+ ";font-weight:800}
  .es-evwhy2[open] > summary::before{content:"\2212 "}
  /* Setup: two modes, then two filters, then only what matches. */
  .es-modes{display:flex;gap:8px;margin-bottom:16px}
  .es-mode{flex:0 0 auto;background:none;border:1.5px solid var(--line);border-radius:999px;
    padding:7px 15px;font:inherit;font-size:13.5px;color:var(--ink-2);cursor:pointer}
  .es-mode:hover{border-color:var(--green);color:var(--green-dk)}
  .es-mode.on{background:var(--green-soft);border-color:var(--green);color:var(--green-dk);font-weight:700}
  .es-step{margin-bottom:14px}
  .es-steplbl{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
    font-weight:700;margin-bottom:7px}
  .es-pills{display:flex;flex-wrap:wrap;gap:6px}
  .es-pill{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;
    font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .es-pill:hover{border-color:var(--green);color:var(--green-dk)}
  .es-pill.on{background:var(--green-soft);border-color:var(--green);color:var(--green-dk);font-weight:700}
  .es-pill.empty{opacity:.42;cursor:default;border-style:dashed}
  .es-pill.empty:hover{border-color:var(--line);background:none}
  .es-pilln{font-size:11px;color:var(--ink-3);font-weight:600}
  .es-pill.on .es-pilln{color:var(--green-dk)}
  .es-qrows{display:flex;flex-direction:column;gap:6px}
  .es-qrow{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;
    padding:10px 13px;font:inherit;font-size:14px;line-height:1.5;color:var(--ink);cursor:pointer}
  .es-qrow:hover{border-color:var(--green);background:var(--green-soft)}
  .es-qrow.on{border-color:var(--green);background:var(--green-soft);font-weight:600}
  .es-chosen{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
  .es-chosenq{font-size:15px;line-height:1.6;color:var(--ink);margin:0}
  /* Marking guidance: a status line, with the detail one press away. */
  .es-rubstatus{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .es-rubtick{color:var(--green-dk);font-weight:800}
  .es-rubtext{font-size:14px;color:var(--ink)}
  .es-rubprov{font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;
    color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:1px 7px}
  .es-rubbox{margin-top:11px;border:1px solid var(--line);border-radius:10px;padding:12px}
  .es-rubpre{white-space:pre-wrap;font:inherit;font-size:13px;line-height:1.6;color:var(--ink);
    background:var(--bg);border-radius:8px;padding:11px;margin:0 0 12px;max-height:280px;overflow:auto}
  .es-blank{font-style:normal;font-weight:800;color:var(--green-dk);letter-spacing:1px}
  /* A slot says what belongs in it. An anonymous blank made the student guess the
     role as well as the content, and in the walkthrough that produced an answer
     entered at the wrong stage. Sentence case, the one green accent. */
  .es-shape .es-hole{background:var(--green-soft);color:var(--green-dk);font-size:12.5px;font-weight:700}
  /* polish reveal */
  .es-polish{margin-top:6px;border-top:1px solid var(--line);padding-top:10px}
  .es-polishtoggle{background:none;border:none;font-family:var(--disp);font-weight:600;font-size:12.5px;color:var(--ink-2);cursor:pointer;padding:2px 0}
  .es-polishtoggle:hover{color:var(--green-dk)}
  .es-polishbody{margin-top:8px}
  .es-nudge.expr{border-left-color:var(--ink-3)} .es-nudge.sign{border-left-color:var(--ink-3)}
  .es-chipwrap{margin-top:6px}
  /* soft sequencing nudge */
  .es-seq{margin-top:12px;font-size:13px;color:var(--ink-2);font-weight:600;line-height:1.5;background:#FAFCFC;border:1.5px solid var(--line);border-left:4px solid var(--green);border-radius:10px;padding:9px 13px}
  /* quiz / mastery */
  .es-quizwrap{margin-top:4px}
  .es-quizcue{border:1.5px solid var(--line);border-left:4px solid var(--green);border-radius:14px;padding:12px 16px;margin-bottom:12px;background:var(--card)}
