<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marginal — Distribution of Income & Wealth</title>
<meta name="description" content="Mastery practice for HSC Economics: flashcards, short answers and AI-marked extended responses.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF3F5; --card:#FFFFFF;
    --ink:#3C4A4A; --ink-2:#7A8A88; --ink-3:#AEBAB8;
    --green:#1CC47D; --green-dk:#14A368; --green-soft:#E4F9EF;
    --blue:#1CA0F2; --blue-dk:#1487D6; --blue-soft:#E2F3FE;
    --gold:#FFB323; --gold-dk:#E89400; --gold-soft:#FFF3D8;
    --coral:#FF7C6B; --coral-dk:#EE5946; --coral-soft:#FFE8E4;
    --line:#E7EDED;
    --disp:'Fredoka',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3,.disp{font-family:var(--disp);letter-spacing:-.01em}
  button{font:inherit;cursor:pointer}
  ::selection{background:var(--green-soft)}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  header{display:flex;align-items:center;gap:12px;padding:16px clamp(16px,4vw,32px);background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:600;font-size:20px}
  .mk{width:28px;height:28px;border-radius:9px;background:var(--green);position:relative;flex:none;box-shadow:0 3px 0 var(--green-dk)}
  .mk::after{content:"";position:absolute;left:7px;right:7px;bottom:6px;height:3px;border-radius:2px;background:#fff}
  .mk::before{content:"";position:absolute;left:7px;bottom:6px;width:3px;height:14px;border-radius:2px;background:rgba(255,255,255,.9)}
  .unit{font-size:13px;color:var(--ink-2);font-weight:700;margin-left:auto;text-align:right}

  main{max-width:1180px;margin:0 auto;padding:28px clamp(16px,4vw,40px) 90px}

  .hi{font-family:var(--disp);font-weight:600;font-size:24px}
  .hi-s{color:var(--ink-2);font-weight:700;font-size:14px;margin:2px 0 20px}

  .areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
  .area{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;transition:transform .12s,box-shadow .12s}
  .setwrap{display:flex;align-items:stretch;gap:8px}
  .setwrap .area{flex:1;min-width:0}
  .setwrap .setrm{flex:none;align-self:stretch}
  .area:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(60,74,74,.1)}
  .area:focus-visible{outline:3px solid var(--green)}
  .aicon{font-size:28px;flex:none;width:52px;height:52px;display:grid;place-items:center;background:var(--green-soft);border-radius:14px}
  .ainfo{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
  .aname{font-family:var(--disp);font-weight:600;font-size:16px}
  .ablurb{font-size:12.5px;color:var(--ink-2);font-weight:700}
  .abar{height:8px;border-radius:99px;background:#EDF2F2;overflow:hidden;margin-top:4px}
  .abar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
  .ameta{font-size:12px;color:var(--ink-3);font-weight:800}

  .settings{margin-top:26px;font-size:14px}
  .settings details{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 18px}
  .settings summary{font-family:var(--disp);font-weight:600;cursor:pointer}
  .settings p{color:var(--ink-2);font-weight:600;margin:10px 0}
  .settings input{width:100%;max-width:440px;font:inherit;font-weight:600;border:2px solid var(--line);border-radius:12px;padding:10px 13px;margin:0 8px 8px 0}
  .settings code{background:var(--bg);padding:1px 6px;border-radius:6px}

  .btn{font-family:var(--disp);font-weight:600;font-size:15px;color:#fff;background:var(--green);border:none;border-radius:14px;padding:12px 24px;box-shadow:0 4px 0 var(--green-dk);transition:transform .08s}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-dk)}
  .btn:disabled{opacity:.6}
  .btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 0 0 2px var(--line) inset}
  .btn.sm{padding:9px 17px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--green-dk)}
  .btn.sm.ghost{box-shadow:0 0 0 2px var(--line) inset}

  .sessionbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .x{background:none;border:none;font-size:20px;color:var(--ink-2);padding:4px 8px;border-radius:10px}
  .x:hover{background:var(--card)}
  .sessionbar .lbl{font-family:var(--disp);font-weight:600;font-size:13.5px;color:var(--ink-2);flex:none}
  .ordtoggle{flex:none;font-family:var(--disp);font-weight:600;font-size:12.5px;color:var(--ink-2);background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer}
  .ordtoggle:hover{border-color:var(--green)}
  .sbar{flex:1;height:11px;background:#E2EAEA;border-radius:99px;overflow:hidden}
  .sbar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}

  .tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .tag{font-family:var(--disp);font-weight:500;font-size:12.5px;padding:5px 11px;border-radius:9px}
  .tag.blue{background:var(--blue-soft);color:var(--blue-dk)} .tag.gold{background:var(--gold-soft);color:var(--gold-dk)} .tag.gray{background:#E8EEEE;color:var(--ink-2)}

  .prompt{font-family:var(--disp);font-weight:500;font-size:21px;line-height:1.35;margin-bottom:16px}
  .scaffold{background:var(--blue-soft);border-radius:14px;padding:12px 16px;margin-bottom:14px;font-size:14px}
  .scaffold summary{font-family:var(--disp);font-weight:600;color:var(--blue-dk);cursor:pointer}
  .scaffold ol{margin:8px 0 4px 20px}
  .scaffold li{margin-bottom:4px;font-weight:600;color:#36678c}

  .choices{display:grid;gap:10px}
  .choice{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;transition:border-color .12s,transform .12s}
  .choice:hover{border-color:var(--green);transform:translateY(-1px)}
  .choice.right{border-color:var(--green);background:var(--green-soft)}
  .choice.wrong{border-color:var(--coral);background:var(--coral-soft)}

  .answerbox{width:100%;font:inherit;font-weight:600;font-size:15.5px;line-height:1.65;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;resize:vertical}
  .answerbox:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .calcin{font:inherit;font-weight:700;font-size:17px;border:2px solid var(--line);border-radius:14px;padding:12px 16px;width:min(280px,100%)}
  .calcin:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .row{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
  .row.center{justify-content:center}
  .hint{font-size:13px;color:var(--ink-3);font-weight:700}

  .sheet{margin-top:18px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--card);animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}}
  .sheet .head{display:flex;align-items:center;gap:14px;padding:16px 20px}
  .sheet.great .head{background:var(--green-soft)} .sheet.good .head{background:var(--green-soft)}
  .sheet.mid .head{background:var(--gold-soft)} .sheet.low .head{background:var(--coral-soft)}
  .sheet h3{font-size:18px;font-weight:600}
  .score{font-family:var(--disp);font-weight:700;font-size:26px;flex:none}
  .score small{font-size:15px;color:var(--ink-2);font-weight:600}
  .sheet .bd{padding:16px 20px}
  .sheet .bd p{font-size:15px;margin-bottom:10px}
  .working{background:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px!important}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 12px}
  .chip{font-family:var(--disp);font-weight:500;font-size:12.5px;padding:5px 11px;border-radius:9px;background:var(--green-soft);color:var(--green-dk)}
  .chip.todo{background:#fff;color:var(--ink-2);box-shadow:0 0 0 1.5px var(--line) inset;cursor:pointer}
  .crit{font-size:14px;margin-bottom:7px;display:flex;gap:9px;align-items:baseline}
  .crit .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--ink-3);transform:translateY(-1px)}
  .crit.met .dot{background:var(--green)} .crit.partial .dot{background:var(--gold)} .crit.missing .dot{background:var(--coral)}
  .next{color:var(--blue-dk);font-weight:700}
  .sheet details{margin:8px 0}
  .sheet summary{font-family:var(--disp);font-weight:600;font-size:14px;color:var(--blue-dk);cursor:pointer}
  .sheet .actions{display:flex;justify-content:flex-end;margin-top:8px}

  .summary{text-align:center;padding:40px 0}
  .bigscore{font-family:var(--disp);font-weight:700;font-size:54px;color:var(--green-dk)}
  .bigscore small{font-size:24px;color:var(--ink-2)}
  .summary h2{font-size:22px;margin:6px 0 10px}
  .summary p{color:var(--ink-2);font-weight:700;max-width:46ch;margin:0 auto 22px}

  .term{color:var(--blue-dk);font-weight:800;border-bottom:2px dotted var(--blue);cursor:pointer}
  .pop{position:absolute;z-index:50;max-width:300px;background:var(--ink);color:#EFF5F5;border-radius:14px;padding:12px 15px;font-size:13.5px;box-shadow:0 12px 30px rgba(27,42,41,.3)}
  .pop b{font-family:var(--disp);display:block;margin-bottom:3px;color:#fff;text-transform:capitalize}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:11px 20px;border-radius:99px;z-index:200}

  .nav{display:flex;gap:6px;background:#E2EAEA;border-radius:99px;padding:5px;width:max-content;margin-bottom:20px}
  .navtab{font-family:var(--disp);font-weight:600;font-size:14px;border:none;background:none;color:var(--ink-2);padding:8px 22px;border-radius:99px}
  .navtab.on{background:var(--card);color:var(--green-dk);box-shadow:0 1px 4px rgba(60,74,74,.12)}
  .bcard{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
  .blabel{display:block;font-family:var(--disp);font-weight:600;font-size:13px;color:var(--ink-2);margin:10px 0 5px}
  .binput{width:100%;font:inherit;font-weight:600;font-size:14.5px;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 13px;background:#FBFDFD}
  .binput:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .binput.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:500}
  textarea.binput{resize:vertical}
  select.binput{appearance:auto}
  .brow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .brow.between{justify-content:space-between;align-items:center}
  .optrow{align-items:center;margin-bottom:8px}
  .optrow input[type=radio]{width:18px;height:18px;accent-color:var(--green);flex:none}
  .bh{font-size:16px;font-weight:600}
  .bhint{font-size:13.5px;color:var(--ink-2);font-weight:600;margin:6px 0 10px}
  .setlist{margin-top:14px}
  .setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;font-weight:600;flex-wrap:wrap}
  .setrow small{color:var(--ink-3)}
  .btn.danger{color:var(--coral-dk)}

  /* ---- auth (sign in / set password) ---- */
  .authgate{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:24px 0}
  .authbrand{font-family:var(--disp);font-weight:800;font-size:22px;color:var(--green-dk);text-align:center;margin-bottom:8px}
  .authcard{max-width:420px;margin:8px auto 0;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:22px}
  .authgate .authcard{margin:0;width:100%;box-shadow:0 12px 40px rgba(60,74,74,.12)}
  .authcard h2{font-family:var(--disp);font-size:20px;margin:0 0 4px}
  .authcard .bhint{margin:2px 0 14px}
  .authfield{margin-bottom:12px}
  .authfield label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:4px}
  .authfield input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit}
  .authfield input:focus{outline:none;border-color:var(--green)}
  .authmsg{font-size:13.5px;font-weight:600;margin-top:10px;min-height:18px}
  .authmsg.err{color:var(--coral-dk)}
  .authmsg.ok{color:var(--green-dk)}
  .authlink{background:none;border:none;color:var(--green-dk);font-weight:700;font-size:13.5px;cursor:pointer;padding:0;text-decoration:underline}
  .whoami{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--ink-2)}

  /* ---- sets manager (compact list) ---- */
  .setsmgr{margin-top:24px}
  .setshead{font-family:var(--disp);font-weight:600;font-size:16px;margin-bottom:2px}
  .setshead small{color:var(--ink-3);font-weight:600}
  .smbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 10px}
  .sminput{flex:1;min-width:160px;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;font-family:inherit}
  .sminput:focus{outline:none;border-color:var(--green)}
  .smsort{padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;font-size:13.5px;font-family:inherit;font-weight:600;background:var(--card)}
  .smtags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .tagchip{font-size:12px;font-weight:700;color:var(--ink-2);background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:4px 11px;cursor:pointer}
  .tagchip.on{background:var(--green-soft);border-color:var(--green);color:var(--green-dk)}
  .smscroll{max-height:430px;overflow-y:auto;border:1.5px solid var(--line);border-radius:14px;background:var(--card)}
  .smrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
  .smrow:first-child{border-top:none}
  .smname{font-family:var(--disp);font-weight:600;font-size:15px;cursor:pointer;min-width:0}
  .smname:hover{color:var(--green-dk)}
  .smmeta{font-size:12px;color:var(--ink-3);font-weight:600;margin-top:2px}
  .smsettags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
  .smsettag{font-size:11px;font-weight:700;color:var(--ink-2);background:var(--green-soft);border-radius:99px;padding:2px 8px}
  .smcount{font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
  .smacts{display:flex;gap:6px;flex:none}
  .smempty{padding:26px 14px;text-align:center;color:var(--ink-3);font-weight:600;font-size:14px}

  .modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:6px}
  .mode{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;transition:transform .12s,border-color .12s}
  .mode:hover:not(:disabled){transform:translateY(-2px);border-color:var(--green)}
  .mode:disabled{opacity:.45}
  .mname{font-family:var(--disp);font-weight:600;font-size:16px}
  .mdesc{font-size:12.5px;color:var(--ink-2);font-weight:700}
  .mcount{font-family:var(--disp);font-weight:600;font-size:12px;color:var(--green-dk);margin-top:4px}
  .hintrow{margin-bottom:12px}
  .hintbtn{font-family:var(--disp);font-weight:600;font-size:13.5px;color:var(--gold-dk);background:none;border:none;padding:4px 0}
  .hintbox{background:var(--gold-soft);border-radius:12px;padding:11px 15px;font-size:14px;font-weight:600;color:#7d5d12;animation:pop .2s ease}
  .flashface{background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:26px;text-align:center}
  .flashprompt{color:var(--ink-2);font-weight:700;font-size:14.5px;margin-bottom:14px}
  .flashanswer{background:var(--card);border:2px solid var(--green);border-radius:18px;padding:20px;animation:pop .25s ease}
  .flashanswer p{font-size:15.5px;margin-bottom:8px}
  .raterow{display:flex;gap:10px;flex-wrap:wrap}
  .btn.rate{flex:1;min-width:100px}
  .btn.rate.low{background:var(--coral);box-shadow:0 4px 0 var(--coral-dk)}
  .btn.rate.mid{background:var(--gold);box-shadow:0 4px 0 var(--gold-dk)}
  .btn.rate.high{background:var(--green);box-shadow:0 4px 0 var(--green-dk)}
  .ctx{margin:10px 0;background:var(--blue-soft);border-radius:12px;padding:10px 14px}
  .ctx summary{font-family:var(--disp);font-weight:600;font-size:14px;color:var(--blue-dk);cursor:pointer}
  .ctx p{margin-top:8px;font-size:14.5px;color:#2d5876}

  .flipwrap{perspective:850px;-webkit-perspective:850px;perspective-origin:center;-webkit-perspective-origin:center}
  .flipcard{position:relative;min-height:250px;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:-webkit-transform .85s cubic-bezier(.35,.65,.25,1),transform .85s cubic-bezier(.35,.65,.25,1);will-change:transform;-webkit-transform:translateZ(0);transform:translateZ(0)}
  .flipcard.flipped{-webkit-transform:rotateY(180deg);transform:rotateY(180deg)}
  .flipwrap.lifting{animation:cardlift .85s cubic-bezier(.35,.65,.25,1)}
  @keyframes cardlift{0%{transform:scale(1)}45%{transform:scale(1.045) translateY(-8px);filter:drop-shadow(0 22px 26px rgba(60,74,74,.22))}100%{transform:scale(1)}}
  .face{backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;background:var(--card)}
  .face.front{z-index:2}
  .face.back{z-index:1}
  .flipcta{display:inline-flex;align-items:center;gap:9px;font-size:16px;padding:13px 28px}
  .flipcta svg{flex:none}
  .face.front{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:16px;border:2px dashed var(--line);padding:26px;text-align:center;cursor:pointer;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .face.front:hover{border-color:var(--green)}
  .face.front:focus-visible{outline:3px solid var(--green)}
  .fprompt{font-family:var(--disp);font-weight:500;font-size:calc(18px * var(--card-scale));line-height:1.4}
  .fliphint{font-size:13px;color:var(--ink-3);font-weight:800}
  .face.back{-webkit-transform:rotateY(180deg);transform:rotateY(180deg);border:2px solid var(--green);padding:18px 20px;min-height:240px;max-height:78vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .backtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .flipback{font-family:var(--disp);font-weight:600;font-size:12.5px;color:var(--ink-2);background:var(--bg);border:none;border-radius:99px;padding:6px 12px}
  .fans{font-size:calc(16px * var(--card-scale));line-height:1.6;margin-bottom:8px}
  @media(prefers-reduced-motion:reduce){.flipcard{transition:none}.flipwrap.lifting{animation:none}}

  /* Single source of truth for card text size (Small/Medium/Large/XL). Only
     .fprompt + .fans read --card-scale, so app chrome never rescales. Default
     = Medium = a comfortable, slightly enlarged size. */
  :root{--card-scale:1.15}
  .cardsize{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
  .cslabel{font-family:var(--disp);font-weight:600;font-size:12.5px;color:var(--ink-2)}
  .csbtn{font-family:var(--disp);font-weight:700;color:var(--ink-2);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px;min-width:44px;cursor:pointer;line-height:1}
  .csbtn:hover{border-color:var(--green)}
  .csbtn.on{background:var(--green-soft);border-color:var(--green);color:var(--green-dk)}
  .csbtn[data-scale="s"]{font-size:13px}
  .csbtn[data-scale="m"]{font-size:15px}
  .csbtn[data-scale="l"]{font-size:17px}
  .csbtn[data-scale="xl"]{font-size:19px}

  .stimulus{background:#FFFDF6;border:1.5px solid var(--gold);border-radius:14px;padding:12px 16px;margin-bottom:14px}
  .stimlabel{font-family:var(--disp);font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-dk);margin-bottom:6px}

  .flipcard.flyright{animation:flyR .24s ease-in forwards}
  .flipcard.flyleft{animation:flyL .24s ease-in forwards}
  .flipcard.flydown{animation:flyD .24s ease-in forwards}
  @keyframes flyR{to{transform:rotateY(180deg) translateX(-120%) rotate(-8deg);opacity:0}}
  @keyframes flyL{to{transform:rotateY(180deg) translateX(120%) rotate(8deg);opacity:0}}

  .flipcard{touch-action:pan-y}

  /* Smartboard / embedded-WebKit fallback: when 3D transforms aren't supported,
     the rotateY flip would snap. Crossfade the front out to reveal the back so
     the card still VISIBLY animates. Back stays in flow so the card still grows.
     Placed AFTER the global .fly* rules so the fade2d override actually wins. */
  @supports not ((transform-style:preserve-3d) or (-webkit-transform-style:preserve-3d)){
    .flipcard{transition:none}
    .flipcard.flipped{-webkit-transform:none;transform:none}
    .face.back{-webkit-transform:none;transform:none}
    .face.front{transition:opacity .4s ease}
    .flipcard.flipped .face.front{opacity:0;pointer-events:none}
    .flipcard.flyright,.flipcard.flyleft,.flipcard.flydown{animation:fade2d .24s ease-in forwards}
    @keyframes fade2d{to{opacity:0}}
  }

  @keyframes iconnudge{0%,86%,100%{transform:rotate(0)}93%{transform:rotate(180deg)}}

  @media(prefers-reduced-motion:reduce){.flipcta svg,.flipback svg{animation:none!important;transition:none!important}}

  .rv-ctxstem{font-size:17px;line-height:1.7;color:var(--ink);font-weight:600;margin-bottom:14px}
  .rv-ctxmeta{display:flex;gap:8px;flex-wrap:wrap}
  .rv-ctxpill{font-family:var(--disp);font-weight:600;font-size:12.5px;background:var(--blue-soft);color:var(--blue-dk);padding:4px 12px;border-radius:9px}
  .rv-ctxnote{font-size:13.5px;color:var(--ink);line-height:1.6;margin-top:12px}
  @media(max-width:680px){.rv-cols{grid-template-columns:1fr}.rv-left{border-right:none;border-bottom:1.5px solid var(--line);display:flex;gap:8px;overflow-x:auto}.rv-right{padding:22px 18px}}

  /* paragraph default view: severity spans, missing chips, status list */
  .rv-span{cursor:pointer;border-radius:4px;padding:0 2px;text-decoration:underline;text-decoration-thickness:2.5px;text-underline-offset:3px}
  .rv-span.good{text-decoration-color:var(--green)}
  .rv-span.weak{text-decoration-color:var(--gold-dk)}
  .rv-span.crit{text-decoration-color:var(--coral-dk)}
  .rv-span.opt{text-decoration-style:dotted;text-decoration-color:var(--blue)}
  .rv-span.skipped{text-decoration-style:dotted}
  .rv-span:hover{background:var(--bg)}
  .rv-misschip{display:inline-flex;align-items:center;gap:7px;font-family:var(--disp);font-weight:600;font-size:13px;color:var(--ink);background:#fff;border:1.5px solid var(--gold-dk);border-radius:11px;padding:6px 13px;margin-left:6px;cursor:pointer;vertical-align:2px;box-shadow:0 2px 0 var(--gold-dk)}
  .rv-misschip:hover{background:var(--gold-soft)}
  .rv-misschip.crit{border-color:var(--coral-dk);box-shadow:0 2px 0 var(--coral-dk)}
  .rv-misschip.crit .rv-missx{background:var(--coral-dk)}
  .rv-misschip.crit:hover{background:var(--coral-soft)}
  .rv-misschip:active{transform:translateY(1px);box-shadow:none}
  .rv-missx{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--gold-dk);color:#fff;font-size:11px;font-weight:800;flex:none}
  /* ===== Phase C: argument and evidence as paragraph context ===== */
  .es-setup{border:1.5px solid var(--green);border-radius:16px;background:var(--card);padding:18px 20px}
  .es-setuph{font-family:var(--disp);font-weight:600;font-size:17px;color:var(--ink)}
  .es-setupsub{font-size:13px;line-height:1.55;color:var(--ink-2);font-weight:600;margin:5px 0 13px}
  .es-pick{display:block;width:100%;text-align:left;font:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
  .es-pick:hover{border-color:var(--green);background:var(--green-soft)}
  .es-pick.on{border-color:var(--green);background:var(--green-soft)}
  .es-pick.own{border-style:dashed;font-weight:700;color:var(--ink-2)}
  .es-pickrel{display:block;font-size:13px;line-height:1.45;color:var(--ink-2);font-weight:600}
  .es-picksub{display:block;font-size:12.5px;line-height:1.5;color:var(--ink-2);font-weight:600;margin-top:4px}
  .es-ownwrap{display:flex;gap:9px;align-items:center;margin-top:9px}
  .es-ownwrap .es-input{flex:1}
  .es-setupbtns{display:flex;gap:14px;align-items:center;margin-top:14px}
  .es-argchanged{border:1.5px solid var(--gold-dk);background:var(--gold-soft);border-radius:12px;padding:10px 13px;margin-bottom:12px;font-size:13px;line-height:1.55;color:var(--ink)}
  .es-rest{border:1.5px solid var(--line);border-radius:16px;background:var(--card);padding:15px 16px;position:sticky;top:8px;display:flex;flex-direction:column;gap:15px}
  .es-resth{font-family:var(--disp);font-weight:600;font-size:14px;color:var(--ink)}
  .es-restblk{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
  .es-restlbl{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  .es-restval{font-size:13.5px;line-height:1.5;color:var(--ink);font-weight:700}
  .es-restown{font-size:11px;font-weight:800;color:var(--green-dk);background:var(--green-soft);border-radius:99px;padding:2px 7px}
  .es-restnone{font-size:13px;color:var(--ink-3);font-weight:600;font-style:italic}
  .es-reststeps{list-style:none;display:flex;flex-direction:column;gap:5px;margin-top:2px}
  .es-reststeps li{font-size:12.5px;font-weight:700;color:var(--ink-3);display:flex;align-items:center;gap:8px}
  .es-reststeps li::before{content:"";width:8px;height:8px;border-radius:50%;border:2px solid var(--ink-3);flex:none}
  .es-reststeps li.done{color:var(--ink-2)}
  .es-reststeps li.done::before{background:var(--green);border-color:var(--green)}
  .es-reststeps li.now{color:var(--ink)}
  .es-reststeps li.now::before{background:var(--green);border-color:var(--green);box-shadow:0 0 0 3px rgba(28,196,125,.25)}

  /* ===== The toolbelt: information comes to the writing, never the reverse ===== */
  .es-belt{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
  .es-belt-b{display:inline-flex;align-items:center;gap:7px;font:inherit;font-weight:700;font-size:12.5px;color:var(--ink-2);background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:6px 13px;cursor:pointer}
  .es-belt-b:hover:not([disabled]){border-color:var(--green);color:var(--ink)}
  .es-belt-b.on{background:var(--green-soft);border-color:var(--green);color:var(--green-dk)}
  .es-belt-b[disabled]{opacity:.42;cursor:default}
  .es-ico{width:15px;height:15px;flex:none}
  /* A fixed-height shell: header and footer hold their place, only the content
     body scrolls. The ceiling here is the fallback; the drawer is also capped at
     the room it actually has, since it starts below the question and the toolbelt
     and a viewport-relative cap alone can push its footer off a short screen. */
  .es-drawer{border:1.5px solid var(--line);border-radius:16px;background:var(--card);display:flex;flex-direction:column;max-height:min(72vh,760px);position:sticky;top:8px;overflow:hidden}
  .es-drawer-top{display:flex;align-items:center;gap:9px;padding:13px 15px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .es-drawer-title{font-family:var(--disp);font-weight:600;font-size:14px;color:var(--ink)}
  .es-drawer-x{margin-left:auto;background:none;border:none;cursor:pointer;color:var(--ink-2);padding:4px;display:grid;place-items:center}
  .es-drawer-x:hover{color:var(--ink)}
  .es-drawer-body{padding:14px 15px;overflow-y:auto;flex:1 1 auto;min-height:0}
  .es-drawer-sub{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  .es-drawer-h{font-family:var(--disp);font-weight:600;font-size:14.5px;color:var(--ink);margin:3px 0 7px}
  .es-drawer-p{font-size:13.5px;line-height:1.6;color:var(--ink);margin-bottom:9px}
  .es-drawer-note{font-size:12.5px;line-height:1.5;color:var(--ink-2);font-weight:600;margin-bottom:8px}
  .es-drawer-none{font-size:13px;color:var(--ink-2);font-weight:600}
  .es-drawer-foot{padding:10px 15px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);font-weight:600;flex:0 0 auto}
  .es-drawer-foot kbd{font:inherit;border:1px solid var(--line);border-radius:5px;padding:0 5px}
  .es-terms{display:flex;gap:6px;flex-wrap:wrap}
  .es-term{font-size:12px;font-weight:700;color:var(--ink);background:var(--green-soft);border-radius:99px;padding:4px 10px}
  .es-idea{font-size:13.5px;line-height:1.55;color:var(--ink);border:1.5px solid var(--line);border-radius:11px;padding:9px 12px;margin-bottom:7px}
  .es-idea.on{border-color:var(--green);background:var(--green-soft)}
  .es-ev{border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px}
  .es-evh{font-family:var(--disp);font-weight:600;font-size:13px;color:var(--green-dk);margin-bottom:4px}
  .es-evflag{display:inline-block;font-size:11px;font-weight:800;color:var(--gold-dk);background:var(--gold-soft);border-radius:99px;padding:3px 9px}
  /* Learn: the concept behind the paragraph, at two depths */
  .es-drawer-block{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
  .es-gloss{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
  .es-gloss dt{font-size:12.5px;font-weight:800;color:var(--ink)}
  .es-gloss dd{font-size:12.5px;line-height:1.55;font-weight:600;color:var(--ink-2);margin:2px 0 9px}
  /* Arguments: what each pathway actually means */
  .es-idea b{display:block;font-size:13.5px;font-weight:700;color:var(--ink)}
  .es-idea span{display:block;font-size:12.5px;line-height:1.55;font-weight:600;color:var(--ink-2);margin-top:3px}
  .es-ideatag{color:var(--green-dk)!important;font-weight:800!important;font-size:11.5px!important}
  /* Evidence: what it is, what it proves here, and what it cannot prove */
  .es-evwhy{font-size:12.5px;line-height:1.55;font-weight:600;color:var(--ink);margin-top:6px}
  .es-evlimit{display:block;font-size:12px;line-height:1.5;font-weight:600;color:var(--gold-dk);margin-top:6px}
  .es-evsrc{font-size:11.5px;font-weight:600;color:var(--ink-3);margin-top:7px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  /* choosing evidence: adding is a click, removing says so */
  .es-pickwrap{margin-bottom:8px}
  .es-pickwrap .es-pick{margin-bottom:0}
  .es-pickwrap.on .es-pick{border-color:var(--green);background:var(--green-soft);cursor:default;opacity:1}
  .es-pickon{display:flex;gap:12px;align-items:center;padding:6px 14px 0}
  .es-pickchosen{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--green-dk)}
  /* the direction rung reads as guidance, never as a sentence to lift */
  .es-rung.direction{border-color:var(--line);background:#FBFDFD}
  .es-rungtext.direction{font-style:normal;color:var(--ink-2);font-weight:600}

  .es-struct{list-style:none;counter-reset:st}
  .es-struct li{display:flex;flex-direction:column;gap:1px;border-left:3px solid var(--line);padding:5px 0 9px 11px;font-size:13px;color:var(--ink-2)}
  .es-struct li.done{border-color:var(--green)}
  .es-struct li.now{border-color:var(--green);color:var(--ink)}
  .es-struct li b{font-family:var(--disp);font-weight:600;font-size:12.5px;color:var(--ink)}
  .es-said.flagged{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold-soft)}
  .es-checkline{display:block;font-size:12px;font-weight:700;color:var(--gold-dk);margin:5px 0 9px}
  .es-checkline .es-linkbtn{font-size:12px;margin-left:7px}

  /* ===== The sentence composer: the scaffold travels with the cursor ===== */
  /* Three states, not one grid with hidden children. Closed support gives its
     space back to the writing; open support takes exactly what it needs. */
  .es-cols{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start;margin-top:14px}
  /* A support tool is temporary, so it goes over the page like every other
     temporary thing. It used to take a grid column, which moved the writing the
     moment a student looked something up. The sheet is fixed and out of flow, so
     the textarea keeps its width and its left edge whatever is open. */
  /* A floating window, like the notebook, because they are peers: both are things
     the student opens beside the writing and can move out of each other's way.
     Not clamped to the viewport edge, and no taller than its contents need. */
  .es-cols > .es-drawer{position:fixed;z-index:150;resize:both;
    min-width:340px;min-height:220px;max-width:92vw;max-height:88vh;
    background:var(--card);border:1.5px solid var(--line);border-radius:14px;
    box-shadow:0 26px 70px rgba(28,40,40,.30);overflow:hidden;padding:0;
    display:flex;flex-direction:column}
  .es-cols > .es-drawer > .es-drawer-top{cursor:move}
  .es-cols > .es-drawer > .es-drawer-top{padding:14px 18px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .es-drawer-ctx{padding:9px 18px 0;font-size:12px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;color:var(--ink-3)}
  /* One surface, four tools: switching swaps the contents rather than opening a
     second panel beside the first. */
  .es-drawer-tabs{display:flex;flex-wrap:wrap;gap:5px;padding:10px 18px 12px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .es-drawer-tab{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 11px;
    font:inherit;font-size:12.5px;color:var(--ink-2);cursor:pointer}
  .es-drawer-tab:hover{border-color:var(--green);color:var(--green-dk)}
  .es-drawer-tab.on{background:var(--green-soft);border-color:var(--green);color:var(--green-dk);font-weight:700}
  .es-cols > .es-drawer > .es-drawer-body{flex:1;min-height:0;overflow:auto;padding:16px 18px}
  .es-cols > .es-drawer > .es-drawer-foot{padding:10px 18px;border-top:1px solid var(--line);flex:0 0 auto}
  /* The decoder host is a permanent child of the columns, placed in the support
     track. It costs nothing until a stem word is pressed, and because it is not the
     node esSwapSide replaces, opening or closing a tool cannot take it away. */
  .es-cols>.es-dechost{grid-column:2}
  .es-cols{grid-auto-flow:row}
  .es-cols>.es-dechost.empty{display:none}
  .es-cols:not(.withdec):not(.withdrawer):not(.withctx)>.es-dechost{display:none}
  /* The response map is a popover now. It keeps its place in the grid only while open. */
  .es-cols>.es-map[hidden]{display:none}
  /* A menu is a menu. Opening the section list used to add a 230px grid column,
     so choosing where to go moved the writing 130px to the right first. It is now
     a popover: out of flow, over the page, gone when it closes, and the grid never
     hears about it. If a `.es-cols.mapopen` column rule ever comes back, that is
     the navigation becoming furniture again. */
  /* A menu hangs off the control that opens it. It used to be a 230px grid column,
     so choosing where to go moved the writing 130px right first; then it was a
     popover anchored to the workspace origin, which put it over the word count.
     It now sits directly under its own button, out of flow, and the grid never
     hears about it either way. */
  .es-parahead{position:relative}
  /* Aligned to the trigger, not merely near it. The button carries
     margin-left:-8px, so its box starts 8px left of the row and left:0 put the
     menu 8px right of the control it belongs to. */
  .es-parahead > .es-map{position:absolute;top:calc(100% + 6px);left:-8px;z-index:30;width:252px;
    background:var(--card);border:1.5px solid var(--line);border-radius:14px;
    box-shadow:0 18px 46px rgba(28,40,40,.22);padding:8px;max-height:min(70vh,520px);
    display:flex;flex-direction:column;overflow:hidden}
  /* The sections scroll; the heading and the word count do not. Before this the
     whole popover scrolled, so on a six-paragraph response the count at the foot
     was cut off by the popover's own edge and looked broken rather than merely
     below the fold. */
  .es-parahead > .es-map > .es-mapscroll{flex:1 1 auto;min-height:0;overflow:auto;
    display:flex;flex-direction:column;gap:3px}
  .es-parahead > .es-map > .es-wordcount{flex:0 0 auto}

  /* A toggle that is open should look open. Both of these already carried
     aria-expanded for screen readers; nothing in the styling used it, so the
     notebook control looked identical whether pressing it would open the
     notebook or close it. Drawn with a shadow rather than padding so that
     turning it on does not move the controls beside it. */
  .es-headacts .es-linkbtn[aria-expanded="true"]{background:var(--green-soft);color:var(--green-dk);
    text-decoration:none;border-radius:6px;box-shadow:0 0 0 4px var(--green-soft)}
  .esl-tab[aria-expanded="true"]{background:var(--green-soft);border-color:var(--green);color:var(--green-dk)}

  /* THE NOTEBOOK. Floating, resizable, above everything including the Learning
     Centre, and never part of any grid: opening it cannot move the writing
     because the writing does not know it exists. Paper rather than UI cards,
     because the student is meant to write on it, not administer it. */
  /* THE STUDY RESOURCES WINDOW. A peer of the notebook and of the tool window:
     floating, its own host at the end of the body, so opening it cannot move the
     writing. Below the notebook and above the tool sheet, because a student who
     opens both is reading and taking notes, and the notes go on top.
     Marginal's own surface, not a paper metaphor: this is a list of links, not
     something to write on. */
  #esstudyhost{position:fixed;inset:0;z-index:250;pointer-events:none}
  .es-study{position:absolute;right:26px;top:96px;pointer-events:auto;resize:both;overflow:hidden;
    width:400px;min-width:320px;min-height:220px;max-width:92vw;max-height:82vh;
    background:var(--card);border:1.5px solid var(--line);border-radius:14px;
    box-shadow:0 26px 70px rgba(28,40,40,.30);display:flex;flex-direction:column}
  /* Nothing to list: the window is the size of the sentence it has to say. */
  .es-study.empty{height:auto;min-height:0;width:auto;max-width:360px;resize:none}
  .es-sthead{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line);flex:0 0 auto;cursor:move}
  .es-sttitle{font-family:var(--disp);font-weight:600;font-size:14.5px;color:var(--ink);flex:1}
  .es-stbody{flex:1 1 auto;min-height:0;overflow:auto;padding:13px}
  .es-stsec + .es-stsec{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2,#EFF4F4)}
  .es-sthd{font-family:var(--disp);font-weight:600;font-size:14px;color:var(--ink);margin-bottom:3px}
  .es-sthelp{font-size:12.5px;color:var(--ink-2);font-weight:700;margin:0 0 10px}
  /* One row per resource: what it is, where it lives, and the link out. The
     open control is an anchor and not a button, so it behaves like a link:
     middle click, open in new window, copy address. */
  /* The name of the resource is what the student is choosing between, so it
     carries the weight. What kind of file it is, and the actions, sit under it
     quietly: three things at the same weight is a list with no shape. */
  .es-stres{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:6px;
    border:1px solid var(--line);border-radius:11px;background:var(--card)}
  .es-stres:hover{border-color:var(--green);background:var(--green-soft)}
  .es-stico{flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:7px;
    background:var(--green-soft);color:var(--green-dk)}
  .es-sttext{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .es-stlabel{font-family:var(--disp);font-weight:600;font-size:14.5px;color:var(--ink);line-height:1.25}
  .es-stsub{font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.01em}
  .es-stopen{flex:none;color:var(--ink-3);padding:5px;border-radius:8px;display:grid;place-items:center;text-decoration:none}
  .es-stopen:hover{background:var(--card);color:var(--green-dk)}
  /* Secondary to the link out, which is the guaranteed route, but a real action
     and drawn like one. It appears only where embedding can actually work, so a
     visible preview control is always a live one. */
  .es-stprev{flex:none;background:none;border:1px solid var(--line);cursor:pointer;font:inherit;
    font-size:11.5px;font-weight:800;color:var(--green-dk);padding:4px 9px;border-radius:8px;white-space:nowrap}
  .es-stprev:hover{background:var(--green-soft);border-color:var(--green)}
  /* No argument chosen yet. It says what would reveal more rather than showing
     an empty heading that looks like something failed. */
  .es-stnote{display:flex;gap:9px;align-items:flex-start;margin-top:14px;padding:11px 12px;
    border:1px solid var(--line);border-radius:11px;background:var(--bg);
    font-size:12.5px;font-weight:700;color:var(--ink-2)}
  .es-stnote .es-ico{flex:none;color:var(--ink-3)}
  /* Tertiary. Opening six tabs at once is occasionally useful and never the
     thing a student should be led towards. */
  .es-stfoot{flex:0 0 auto;padding:8px 13px;border-top:1px solid var(--line)}
  .es-stall{font-size:12px;color:var(--ink-2);text-decoration-color:var(--line)}
  .es-stall:hover{color:var(--green-dk)}
  .es-stprevwrap{display:flex;flex-direction:column;gap:9px;height:100%}
  .es-stprevhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .es-stframe{flex:1 1 auto;min-height:220px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
  .es-stframe iframe{width:100%;height:100%;min-height:220px;border:0;display:block}
  .es-stfall{font-size:12.5px;font-weight:700;color:var(--ink-2);margin:0;padding:12px;
    border:1px solid var(--line);border-radius:10px;background:var(--bg)}

  #esnbhost{position:fixed;inset:0;z-index:300;pointer-events:none}
  .es-nb{position:absolute;right:26px;bottom:26px;pointer-events:auto;resize:both;overflow:hidden;
    min-width:300px;min-height:280px;max-width:92vw;max-height:88vh;
    background:#fffdf7;border:1.5px solid var(--line);border-radius:14px;
    box-shadow:0 26px 70px rgba(28,40,40,.32);display:flex;flex-direction:column}
  .es-nbhead{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #eadfc6;flex:0 0 auto}
  .es-nbtitle{font-family:var(--disp);font-weight:600;font-size:14.5px;color:#2c2a24;flex:1}
  .es-nbact{background:none;border:none;padding:0;cursor:pointer;font:inherit;font-size:12.5px;
    color:#6b6455;text-decoration:underline}
  .es-nbact:hover{color:var(--green-dk)}
  .es-nbx{background:none;border:none;cursor:pointer;color:#6b6455;padding:3px;display:grid;place-items:center;border-radius:7px}
  .es-nbx:hover{background:var(--green-soft);color:var(--green-dk)}
  /* Ruled paper. The lines sit under the text at the same rhythm as the line
     height, so writing lands on them. */
  .es-nbpaper{flex:1;min-height:0;width:100%;border:none;outline:none;resize:none;
    font:inherit;font-size:15px;line-height:28px;color:#1d1b16;background-color:#fffdf7;
    background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,#e7dcc2 27px,#e7dcc2 28px);
    background-attachment:local;padding:6px 16px 16px;letter-spacing:.1px}
  .es-nbpaper::placeholder{color:#a9a08c}
  .es-nbfoot{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid #eadfc6;flex:0 0 auto}
  .es-nbstep{background:none;border:1px solid #e0d5bb;border-radius:7px;cursor:pointer;color:#4a4438;
    width:26px;height:26px;display:grid;place-items:center;font-size:15px}
  .es-nbstep:disabled{opacity:.35;cursor:default}
  .es-nbstep:not(:disabled):hover{border-color:var(--green);color:var(--green-dk)}
  .es-nbpagename{flex:1;min-width:0;font:inherit;font-size:13px;font-weight:700;color:#2c2a24;
    background:none;border:1px solid transparent;border-radius:6px;padding:3px 6px}
  .es-nbpagename:hover{border-color:#e0d5bb}
  .es-nbpagename:focus{outline:none;border-color:var(--green);background:#fff}
  .es-nbcount{font-size:12px;color:#6b6455;white-space:nowrap}
  .es-nbbar{display:flex;gap:8px;padding:10px 12px 4px;align-items:center;flex-wrap:wrap}
  .es-nbname{flex:1;min-width:140px;font:inherit;font-size:13.5px;border:1.5px solid #e0d5bb;border-radius:8px;
    padding:6px 9px;background:#fff;color:#1d1b16}
  .es-nbname:focus{outline:none;border-color:var(--green)}
  .es-nbnote{font-size:12px;color:#6b6455;line-height:1.5;margin:4px 12px 8px}
  .es-nblib{padding:8px 12px;max-height:150px;overflow:auto}
  .es-nbrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #eadfc6}
  .es-nbrown{flex:1;font-size:13.5px;color:#1d1b16;font-weight:600}
  .es-rest.quiet.empty{display:none}
  /* Long lines are hard to write into as well as to read. */
  /* The shell takes the width so no column stands empty, but the card inside it is
     capped at the width that still fits once a tool or the context panel is open.
     That keeps the older promise this file already made: the writing is the
     product, and it does not reflow to make room for a resource. Only the
     learning centre, which the student opens deliberately to stop writing and
     read, is allowed to narrow it. */
  .es-compose{max-width:none;min-width:0}
  .es-compose>*{max-width:940px;margin-left:auto;margin-right:auto}
  /* One line above the writing carries what the two columns used to: which section,
     how much is written, and which stage this sentence is at. */
  .es-parapick{display:inline-flex;align-items:center;gap:6px;font:inherit;background:none;
    border:1.5px solid transparent;border-radius:9px;padding:3px 8px;margin-left:-8px;cursor:pointer}
  .es-parapick:hover{border-color:var(--line);background:var(--card)}
  .es-parachev{color:var(--ink-3);font-size:11px}
  .es-parameta,.es-parastage{font-size:12px;font-weight:600;color:var(--ink-3)}
  .es-parahead .es-headacts{margin-left:auto;display:flex;align-items:baseline;gap:12px}
  .es-parastage{color:var(--green-dk)}
  /* Below the width where all three fit, the drawer OVERLAYS. The composer never
     shrinks to make room for a resource: the writing is the product. */
  @media(max-width:1320px){
    .es-cols{grid-template-columns:minmax(0,1fr)}
    .es-cols.withdrawer .es-drawer{position:fixed;right:16px;top:76px;bottom:16px;width:min(390px,86vw);z-index:130;max-height:none;box-shadow:0 20px 60px rgba(28,40,40,.28)}
  }
  .es-map{position:sticky;top:8px;display:flex;flex-direction:column;gap:3px}
  .es-maph{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
  .es-mapitem{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;border-radius:9px;padding:7px 9px;cursor:pointer;font:inherit;font-size:13px;font-weight:700;color:var(--ink-2)}
  .es-mapitem:hover{background:var(--green-soft)}
  .es-mapitem.on{background:var(--green-soft);color:var(--ink)}
  .es-mapitem.done{color:var(--ink)}
  .es-mapdot{width:9px;height:9px;border-radius:50%;border:2px solid var(--ink-3);flex:none}
  .es-mapitem.done .es-mapdot{background:var(--green);border-color:var(--green)}
  .es-mapitem.on .es-mapdot{background:var(--green);border-color:var(--green);box-shadow:0 0 0 3px rgba(28,196,125,.25)}
  .es-wordcount{margin-top:14px;padding-top:11px;border-top:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink-3);display:flex;flex-direction:column;gap:2px;cursor:default}
  .es-wordcount b{color:var(--ink-2)}
  .es-wctarget{color:var(--ink-3);font-weight:600}
  /* O1: the writing state. Chips carry context; the paragraph carries the eye. */
  .es-chips{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:2px 0 12px}
  .es-chip-arg,.es-chip-ev{display:inline-flex;align-items:center;gap:6px;max-width:min(38ch,100%);font:inherit;
    font-size:12.5px;font-weight:700;color:var(--ink);background:var(--green-soft);border:1.5px solid transparent;
    border-radius:99px;padding:5px 12px;cursor:pointer;text-align:left}
  .es-chip-ev{background:var(--card);border-color:var(--line);color:var(--ink-2)}
  .es-chip-arg:hover,.es-chip-ev:hover{border-color:var(--green)}
  .es-chip-arg span,.es-chip-ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .es-chip-arg .es-ico,.es-chip-ev .es-ico{width:14px;height:14px;flex:none;opacity:.75}
  .es-chip-arg.empty,.es-chip-ev.empty{background:none;border-style:dashed;border-color:var(--line);color:var(--ink-3);font-weight:600}
  .es-chip-note{font-size:12px;font-weight:600;color:var(--ink-3);max-width:30ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .es-chip-more{font:inherit;font-size:11.5px;font-weight:700;color:var(--ink-3);background:none;border:none;cursor:pointer;padding:4px 2px}
  .es-chip-more:hover{color:var(--green-dk)}
  .es-linkbtn.armed{color:var(--green-dk);font-weight:800}
  .es-helpask{font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--card);
    border:1.5px solid var(--line);border-radius:99px;padding:5px 14px;cursor:pointer}
  .es-helpask:hover{border-color:var(--green);color:var(--green-dk)}
  .es-helpask.on{color:var(--green-dk);border-color:var(--green-soft);background:var(--green-soft)}
  /* decoding the question: light emphasis on the stem, nothing standing open */
  .es-qbar-main{min-width:0;flex:1}
  .es-dec{font:inherit;font-size:inherit;font-weight:inherit;color:inherit;background:none;border:none;padding:0 1px;
    cursor:pointer;border-bottom:2px dotted var(--ink-3);border-radius:2px}
  .es-dec:hover{border-bottom-color:var(--green);background:var(--green-soft)}
  .es-dec.on{background:var(--green-soft);border-bottom-color:var(--green);color:var(--green-dk)}
  .es-dec.verb{border-bottom-style:solid;border-bottom-color:var(--green)}
  .es-decrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:9px}
  .es-decchip{font:inherit;font-size:12px;font-weight:700;color:var(--ink-2);background:var(--card);
    border:1.5px solid var(--line);border-radius:99px;padding:4px 12px;cursor:pointer}
  .es-decchip:hover{border-color:var(--green);color:var(--green-dk)}
  .es-decchip.on{border-color:var(--green);background:var(--green-soft);color:var(--green-dk)}
  .es-dechint{font-size:11.5px;font-weight:600;color:var(--ink-3)}
  .es-decbox{position:relative;margin-top:10px;border:1.5px solid var(--green-soft);background:#FBFEFC;
    border-radius:13px;padding:13px 40px 13px 15px}
  .es-dech{font-family:var(--disp);font-weight:600;font-size:14px;color:var(--ink);display:flex;gap:9px;
    align-items:baseline;flex-wrap:wrap;margin-bottom:5px}
  .es-deckind{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
  .es-decp{font-size:13.5px;line-height:1.6;font-weight:600;color:var(--ink-2);margin-bottom:6px}
  .es-decp b{color:var(--ink)}
  .es-declist{margin:5px 0 0 17px;display:flex;flex-direction:column;gap:4px}
  .es-declist li{font-size:13px;line-height:1.55;font-weight:600;color:var(--ink-2)}
  .es-decnote{font-size:12px;line-height:1.5;font-weight:600;color:var(--ink-3);margin-top:8px}
  .es-decx{position:absolute;top:9px;right:9px;background:none;border:none;cursor:pointer;color:var(--ink-3);
    padding:4px;border-radius:8px;display:flex}
  .es-decx:hover{color:var(--ink);background:var(--green-soft)}
  .es-decx .es-ico{width:15px;height:15px}
  /* Learn: the opening line reads as the opening without becoming a heading, because
     an extracted sentence is not an authored definition and must not claim to be. */
  /* ---- the learning centre -------------------------------------------------
     Its own host at the end of body, never inside #eshost, so the composer
     underneath keeps its node identity whatever happens in here. The host does
     not take pointer events; only the panel does, so the essay stays visible
     and the student can see they have not lost their place. */
  #eslhost{position:fixed;inset:0;z-index:200;pointer-events:none}
  .esl-panel{position:absolute;top:16px;bottom:16px;right:16px;width:var(--esl-w);
    pointer-events:auto;background:var(--card);border:1.5px solid var(--line);border-radius:18px;
    box-shadow:0 24px 70px rgba(28,40,40,.30);display:flex;flex-direction:column;overflow:hidden}
  .esl-panel.left{right:auto;left:16px}
  /* The centre sits BESIDE the writing, not over it. The scrim is the essay's own
     scroll container, so giving it padding on the panel's side contracts the
     workspace and leaves both fully visible. It is a class on body and nothing is
     rebuilt, so the composer keeps its node, caret, scroll and undo history. */
  :root{--esl-w:clamp(420px,42vw,660px)}
  /* THE CENTRE IS THE TEMPORARY SURFACE. It used to sit beside the writing and
     contract it, so opening reference material re-laid-out the workspace: the
     composer moved, the grid changed columns, the third column vanished. The
     supplementary task now goes over the primary one, which is the ordinary way
     round. The workspace underneath is not touched at all, so there is nothing
     to reflow, nothing to move and nothing to rebuild. */
  #eslhost.on{pointer-events:auto;background:rgba(28,40,40,.42)}
  .esl-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:min(1200px,90vw);height:min(860px,90vh);max-width:none;bottom:auto;right:auto;border-radius:16px}
  /* Learning on the left, notes on the right, and nothing else in either. */
  .esl-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;min-height:0;flex:1;overflow:hidden}
  .esl-main{overflow:auto;min-width:0;padding-right:2px}
  .esl-notes{border-left:1px solid var(--line);padding-left:16px;display:flex;flex-direction:column;gap:9px;min-height:0}
  /* internal navigation, not another modal */
  .esl-back{background:none;border:none;cursor:pointer;font:inherit;font-size:13.5px;color:var(--ink-2);
    padding:0;margin-bottom:10px;text-decoration:underline}
  .esl-back:hover{color:var(--green)}
  .esl-l1{font-family:var(--disp);font-size:19px;font-weight:600;color:var(--ink);margin:0 0 6px}
  .esl-glance{background:var(--green-soft);border-radius:12px;padding:12px 14px;margin-bottom:14px}
  .esl-keys{margin:8px 0 0;padding-left:18px}
  .esl-keys li{font-size:14px;line-height:1.6;color:var(--ink);margin-bottom:3px}
  .esl-layer{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .esl-layerh{width:100%;text-align:left;background:none;border:none;cursor:pointer;font:inherit;
    font-size:14.5px;font-weight:700;color:var(--ink);padding:11px 14px;display:flex;justify-content:space-between;gap:10px}
  .esl-layerh:hover{background:var(--green-soft)}
  .esl-layerb{padding:0 14px 13px;font-size:14px;line-height:1.65;color:var(--ink)}
  .esl-flow{display:flex;flex-direction:column;gap:2px;margin:10px 0;font-size:13.5px}
  .esl-flownode{background:var(--green-soft);border-radius:8px;padding:7px 11px;color:var(--ink);font-weight:600;align-self:flex-start}
  .esl-flowarrow{color:var(--ink-2);padding-left:12px}
  .esl-tile.can{cursor:pointer;text-align:left;font:inherit;width:100%}
  .esl-tile.can:hover{border-color:var(--green);background:var(--green-soft)}
  .esl-tilego{display:block;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--green-dk)}
  .esl-pick{width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;
    padding:12px 14px;cursor:pointer;font:inherit;margin-bottom:8px;display:block}
  .esl-pick:hover{border-color:var(--green);background:var(--green-soft)}
  .esl-pickt{font-weight:700;font-size:15px;color:var(--ink);display:block}
  .esl-picks{font-size:13px;color:var(--ink-2);display:block;margin-top:3px;line-height:1.5}
  /* The workspace gives up its third column while the centre is open, rather than
     clipping it. The node stays in the DOM, only hidden, so esSwapSide still finds
     the side column it swaps and the tool path is unaffected. */
  /* With the map now a popover, the composer is the first grid child, so the
     contracted state is a single column. The earlier rule sized the composer as
     though it were still the navigation track. */
  /* Deliberately empty. The workspace keeps its grid, its columns and its scroll
     position while the centre is open. If a rule ever needs to go here again,
     that is the signal that the overlay has started resizing the page again. */
  .esl-head{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .esl-title{font-family:var(--disp);font-weight:600;font-size:16px;color:var(--ink);margin:0;flex:1}
  .esl-title:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:5px}
  .esl-dock,.esl-x{background:none;border:none;cursor:pointer;color:var(--ink-2);padding:5px;
    display:grid;place-items:center;border-radius:8px;font-size:15px}
  .esl-dock:hover,.esl-x:hover{color:var(--ink);background:var(--green-soft)}
  .esl-q{margin:0;padding:12px 18px;font-size:13.5px;font-weight:600;color:var(--ink-2);
    border-bottom:1px solid var(--line);flex:0 0 auto}
  .esl-tabs{display:flex;gap:4px;padding:11px 18px 0;flex:0 0 auto;flex-wrap:wrap}
  .esl-tab{font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-2);background:none;
    border:1.5px solid transparent;border-radius:99px;padding:6px 13px;cursor:pointer}
  .esl-tab:hover{color:var(--ink);background:var(--green-soft)}
  .esl-tab.on{background:var(--green-soft);border-color:var(--green);color:var(--green-dk)}
  .esl-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px 18px 20px}
  .esl-lede{font-size:15.5px;line-height:1.6;font-weight:600;color:var(--ink);margin:0 0 14px}
  .esl-p{font-size:14px;line-height:1.65;color:var(--ink);margin:0}
  .esl-none{font-size:13.5px;font-weight:600;color:var(--ink-2)}
  .esl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px}
  .esl-grid.six{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
  .esl-grid.three{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .esl-tile{border:1.5px solid var(--line);border-radius:13px;padding:13px 14px;background:var(--card)}
  .esl-tilet{font-family:var(--disp);font-weight:600;font-size:14px;color:var(--ink);margin-bottom:5px}
  .esl-tileb{font-size:13px;line-height:1.55;color:var(--ink-2);margin:0}
  .esl-tilen{font-size:11.5px;line-height:1.5;color:var(--ink-3);margin:6px 0 0;font-weight:600}
  .esl-card{display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;cursor:pointer;
    border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;background:var(--card)}
  .esl-card:hover{border-color:var(--green)}
  .esl-cardt{font-family:var(--disp);font-weight:600;font-size:15px;color:var(--ink)}
  .esl-cardb{font-size:12.5px;line-height:1.5;color:var(--ink-2)}
  .esl-sec{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .esl-sech{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-3);margin-bottom:6px}
  .esl-link{border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:12px}
  .esl-chain{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
  .esl-node{font-family:var(--disp);font-weight:600;font-size:14px;color:var(--ink);
    background:var(--green-soft);border-radius:9px;padding:6px 11px}
  .esl-mid{font-size:12.5px;font-weight:600;color:var(--ink-3);padding:0 11px}
  .esl-arrow{color:var(--green);font-size:13px;line-height:1;padding-left:15px}
  .esl-more{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
  .esl-more>summary{font-size:12.5px;font-weight:700;color:var(--green-dk);cursor:pointer;
    list-style:none;padding:2px 0}
  .esl-more>summary::-webkit-details-marker{display:none}
  .esl-more>summary::before{content:"› ";display:inline-block;transition:transform .12s}
  .esl-more[open]>summary::before{content:"⌄ "}
  .esl-more>summary:hover{color:var(--ink)}
  .esl-more .esl-sech{margin-top:10px}
  .esl-says{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
  .esl-quote{font-size:13px;line-height:1.6;color:var(--ink);margin:0 0 7px;
    border-left:2.5px solid var(--green-soft);padding-left:11px}
  /* Where nothing is authored, the absence is stated rather than filled. */
  .esl-gap{font-size:12.5px;line-height:1.55;color:var(--ink-3);font-weight:600;margin:11px 0 0}
  .esl-foot{display:flex;align-items:center;gap:14px;padding:12px 18px;border-top:1px solid var(--line);flex:0 0 auto}
  .esl-footg{font-size:12px;color:var(--ink-2);font-weight:600;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .esl-footg b{color:var(--ink-3);font-size:10.5px;letter-spacing:.06em}
  /* The expand action sits outside the drawer's scrolling body on purpose, so it
     is always reachable and cannot alter what the D4 height cap measures. */
  .es-drawer-open{padding:9px 15px;border-bottom:1px solid var(--line);flex:0 0 auto}
  /* Below the width where a contracted workspace and the panel cannot both work,
     the panel goes back to being an overlay and the workspace takes its width back. */
  @media(max-width:1180px){
    .esl-panel,.esl-panel.left{left:12px;right:12px;top:12px;bottom:12px;width:auto;height:auto;transform:none;max-width:none}
    .esl-body{grid-template-columns:minmax(0,1fr)}
    .esl-notes{border-left:none;border-top:1px solid var(--line);padding-left:0;padding-top:12px}
  }
  .es-learn-lede{font-weight:600}
  /* The row list is the primary content on the first screen here, not a reference
     list at the foot of a scroll, so it loses the section rule and gains a little air. */
  .es-gloss.surface{margin-top:10px;padding-top:0;border-top:none}
  .es-gloss.surface dd{margin:2px 0 11px}
  /* The chain was written for the full-width lesson; in a 310px drawer track it needs
     to be tighter. Scoped so the lesson rendering is untouched. */
  .es-drawer .es-chain{margin:2px 0 0}
  .es-drawer .es-chainstep{font-size:13px}
  .es-rest .es-decbox{margin:0 0 4px;padding:13px 34px 13px 14px}
  .es-drawer > .es-decbox{margin:0;border-width:0 0 1.5px;border-radius:15px 15px 0 0;flex:0 1 auto;overflow-y:auto;max-height:min(40vh,300px)}
  .es-rest .es-decp{font-size:13px}
  .es-rest .es-dech{font-size:13.5px}
  /* the planning surface: rich while deciding, compact once decided */
  .es-core{border:1.5px solid var(--line);border-radius:14px;background:none;padding:10px 15px}
  .es-core.open{border-color:var(--green-soft);background:#FBFEFC}
  .es-corerow{display:flex;gap:13px;align-items:baseline;flex-wrap:wrap}
  .es-corelbl{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  .es-corepat{font-size:13.5px;font-weight:700;color:var(--green-dk);flex:1;min-width:0}
  /* judgement questions: a position, and what each argument does for it */
  .es-judge{border:1.5px solid var(--green);border-radius:16px;background:var(--card);padding:15px 18px}
  .es-judge.done{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;border-color:var(--line);padding:10px 15px}
  .es-judgeh{font-family:var(--disp);font-weight:600;font-size:16px;color:var(--ink)}
  .es-judgeline{font-size:14px;font-weight:700;color:var(--ink);flex:1;min-width:0}
  .es-tprole{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    border-radius:99px;padding:2px 9px;margin-left:8px;white-space:nowrap}
  .es-tprole.support{color:var(--green-dk);background:var(--green-soft)}
  .es-tprole.conditional{color:var(--gold-dk);background:var(--gold-soft)}
  .es-tprole.limitation{color:var(--ink-2);background:#EEF2F2}
  .es-tpargs{flex:1;min-width:0}
  .es-thesispos{display:flex;gap:11px;align-items:baseline;flex-wrap:wrap;margin:10px 0 4px;
    padding:9px 13px;border-radius:11px;background:var(--green-soft);font-size:13.5px;font-weight:700;color:var(--ink)}
  .es-coreh{font-family:var(--disp);font-weight:600;font-size:16px;color:var(--ink)}
  .es-corerel{font-size:15px;line-height:1.6;font-weight:700;color:var(--ink);margin:7px 0 13px}
  .es-corebtns{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .es-corebody{margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
  .es-corep{font-size:13.5px;line-height:1.65;font-weight:600;color:var(--ink-2);margin-bottom:9px}
  .es-corep.chain{color:var(--ink);font-weight:700}
  .es-corep.miss{color:var(--gold-dk)}
  .es-corep.model{color:var(--ink);font-weight:700}
  /* why an argument is an argument */
  .es-optwrap{margin-bottom:7px}
  .es-optwrap .es-pick{margin-bottom:0}
  .es-why{font:inherit;font-size:11.5px;font-weight:700;color:var(--ink-3);background:none;border:none;
    cursor:pointer;padding:4px 6px;margin-left:2px}
  .es-why:hover,.es-why.on{color:var(--green-dk)}
  .es-whybox{border-left:2px solid var(--green-soft);margin:6px 0 4px 13px;padding:4px 0 4px 13px}
  /* the thesis, written once the plan exists */
  .es-thesis{border:1.5px solid var(--line);border-radius:16px;background:var(--card);padding:15px 18px;margin-top:4px}
  .es-planhh.sm{font-size:16px}
  .es-thesisplan{list-style:none;display:flex;flex-direction:column;gap:5px;margin:11px 0 14px}
  .es-thesisplan li{font-size:13px;line-height:1.5;font-weight:700;color:var(--ink);display:flex;gap:9px}
  .es-tparea{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--green-dk);
    min-width:120px;flex:none;padding-top:2px}
  .es-thesisguide{font-size:12.5px;line-height:1.55;font-weight:600;color:var(--ink-2);margin:7px 0 12px}
  .es-compare{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
  .es-cmpblk{margin-bottom:12px}
  .es-cmplist{margin:5px 0 0 17px;display:flex;flex-direction:column;gap:4px}
  .es-cmplist li{font-size:13px;line-height:1.55;font-weight:600;color:var(--ink-2)}
  /* the guide: a short title, the step position, one instruction */
  .es-guidetop{display:flex;align-items:center;gap:10px}
  .es-steps{display:inline-flex;align-items:center;gap:2px;margin-left:auto}
  .es-step{font:inherit;font-size:15px;line-height:1;font-weight:700;color:var(--ink-3);background:none;border:none;
    border-radius:7px;padding:3px 7px;cursor:pointer}
  .es-step:hover:not(:disabled){color:var(--green-dk);background:var(--green-soft)}
  .es-step:disabled{opacity:.35;cursor:default}
  .es-stepn{font-size:11px;font-weight:700;color:var(--ink-3);min-width:26px;text-align:center}
  /* read the whole response belongs where reading happens */
  .es-maph{display:flex;align-items:center;gap:8px}
  .es-mapall{margin-left:auto;font:inherit;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    color:var(--ink-3);background:none;border:none;cursor:pointer;padding:2px 4px}
  .es-mapall:hover{color:var(--green-dk)}
  /* the rail recedes at rest and comes forward when a drawer is open */
  .es-rest.quiet{border-color:transparent;background:none;padding:15px 4px}

  /* the response plan: the whole essay decided once, before the introduction */
  .es-planwrap{display:flex;flex-direction:column;gap:14px;max-width:960px;margin:0 auto}
  .es-planhh{font-family:var(--disp);font-weight:600;font-size:20px;color:var(--ink)}
  .es-plansub{font-size:13.5px;line-height:1.6;color:var(--ink-2);font-weight:600;margin-top:5px}
  .es-plannote{margin-top:10px;font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--green-soft);border-radius:10px;padding:8px 12px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .es-plancards{display:flex;flex-direction:column;gap:10px}
  .es-planrow{display:flex;gap:11px;align-items:center;border:1.5px dashed var(--line);border-radius:12px;padding:10px 15px}
  .es-planidle{font-size:12.5px;font-weight:600;font-style:italic;color:var(--ink-3);flex:1}
  .es-plancard{border:1.5px solid var(--line);border-radius:16px;background:var(--card);padding:15px 17px}
  .es-plancard.done{border-color:var(--green-soft);background:#FCFEFD}
  .es-planh{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .es-plandot{width:9px;height:9px;border-radius:50%;border:2px solid var(--ink-3);flex:none}
  .es-plancard.done .es-plandot{background:var(--green);border-color:var(--green)}
  .es-plann{font-family:var(--disp);font-weight:600;font-size:14.5px;color:var(--ink)}
  .es-planarea{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--green-dk);background:var(--green-soft);border-radius:99px;padding:3px 9px}
  .es-planareas{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
  .es-areachip{font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer}
  .es-areachip:hover{border-color:var(--green)}
  .es-areachip.on{border-color:var(--green);background:var(--green-soft);color:var(--ink)}
  .es-planask{font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:8px}
  .es-areaused{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--green-dk);
    background:var(--green-soft);border-radius:99px;padding:2px 7px;margin-left:8px}
  .es-planopts .es-pick{margin-bottom:7px}
  .es-planshort{font-size:15px;line-height:1.45;font-weight:700;color:var(--green-dk);margin-bottom:3px}
  .es-planval{font-size:13.5px;line-height:1.5;color:var(--ink-2);font-weight:600}
  .es-planmeaning{font-size:12.5px;line-height:1.55;font-weight:600;color:var(--ink-3);margin-top:4px}
  .es-pickshort{display:block;font-size:14px;line-height:1.4;font-weight:700;color:var(--green-dk);margin-bottom:2px}
  .es-planev{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
  .es-planevlbl{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  .es-evchip{font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer}
  .es-evchip:hover{border-color:var(--green)}
  .es-evchip.on{border-color:var(--green);background:var(--green-soft);color:var(--ink)}
  .es-planevnote{font-size:12px;font-weight:600;color:var(--ink-3)}
  .es-planfoot{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-top:4px}
  .es-planstate{font-size:12.5px;font-weight:600;color:var(--ink-2)}
  /* the plan, read from the introduction and the conclusion */
  .es-planlist{list-style:none;display:flex;flex-direction:column;gap:7px;counter-reset:pl;width:100%}
  .es-planjump{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;font:inherit;background:none;border:none;border-left:2px solid var(--green-soft);padding:2px 0 2px 10px;cursor:pointer}
  .es-planjump:hover{border-left-color:var(--green)}
  .es-planlrole{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
  .es-planlarg{font-size:13px;line-height:1.45;font-weight:700;color:var(--ink)}
  .es-planlw{font-size:11.5px;font-weight:700;color:var(--green-dk)}
  .es-planlw.muted{color:var(--ink-3);font-weight:600}
  .es-planlwrote{font-size:13px;line-height:1.5;font-weight:700;color:var(--ink)}
  .es-planlarg.planned{font-size:11.5px;font-weight:600;color:var(--ink-3);font-style:italic}
  .es-twin{margin-top:11px;border:1.5px solid var(--gold-dk);background:var(--gold-soft);border-radius:12px;
    padding:10px 13px;font-size:12.5px;line-height:1.55;font-weight:600;color:var(--ink)}
  .es-twinbtns{display:flex;gap:14px;margin-top:7px}
  /* the working answer: the system's understanding, never the student's prose */
  .es-startwrap{display:flex;flex-direction:column;gap:14px}
  .es-wa{border:1.5px solid var(--green);border-radius:16px;background:var(--card);padding:14px 17px}
  .es-warow{display:flex;gap:11px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
  .es-wanote{font-size:11.5px;font-weight:600;color:var(--ink-3)}
  .es-watext{font-size:15px;line-height:1.6;font-weight:700;color:var(--ink)}
  .es-wapos{display:flex;gap:11px;align-items:baseline;flex-wrap:wrap;margin-top:10px;padding-top:10px;
    border-top:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--ink)}
  .es-cover{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1.5px solid var(--line);
    border-radius:13px;padding:11px 15px}
  .es-cover.missing{border-color:var(--gold-dk);background:var(--gold-soft);
    align-items:flex-start;flex-direction:column;gap:9px}
  .es-cover.done{border-color:var(--green-soft);background:#FBFEFC;font-size:13px;font-weight:600;color:var(--ink-2)}
  .es-covitem{font-size:12px;font-weight:700;color:var(--ink-2);background:var(--card);border:1.5px solid var(--line);
    border-radius:99px;padding:4px 11px}
  .es-covitem.on{border-color:var(--green);background:var(--green-soft);color:var(--green-dk)}
  .es-areachip.fixed{cursor:default;opacity:.85}
  .es-coverbtns{display:flex;gap:8px;flex-wrap:wrap}
  .es-startrows{display:flex;flex-direction:column;gap:6px}
  .es-startrow{display:flex;gap:11px;align-items:center;width:100%;text-align:left;font:inherit;
    border:1.5px dashed var(--line);border-radius:12px;padding:10px 15px;background:none;cursor:pointer}
  .es-startrow:hover{border-color:var(--green)}
  .es-startrow.planned,.es-startrow.written{border-style:solid}
  .es-startrow.written{background:#FBFEFC}
  .es-startrow.written .es-plandot,.es-startrow.planned .es-plandot{background:var(--green);border-color:var(--green)}
  .es-startwhat{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--ink-2);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .es-startstate{font-size:11.5px;font-weight:700;color:var(--ink-3)}
  .es-startbtns{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-top:2px}
  .es-mapwa{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;font:inherit;background:var(--bg);
    border:none;border-radius:11px;padding:9px 11px;margin-bottom:8px;cursor:pointer}
  .es-mapwa:hover{background:var(--green-soft)}
  .es-mapwatext{font-size:12px;line-height:1.5;font-weight:600;color:var(--ink-2);
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .es-drift{border:1.5px solid var(--gold-dk);background:var(--gold-soft);border-radius:13px;padding:13px 16px;margin-top:13px}
  .es-drifth{font-family:var(--disp);font-weight:600;font-size:14.5px;color:var(--ink);margin-bottom:9px}
  .es-driftblk{margin-bottom:9px}
  .es-drift .es-wanote{display:block;margin-top:6px}
  /* the pathway lesson: one surface about one argument */
  .es-lesson{display:flex;flex-direction:column;gap:15px}
  .es-lessonctx{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;flex-wrap:wrap;
    border:1.5px solid var(--line);border-radius:13px;padding:11px 15px;background:var(--paper);
    position:sticky;top:4px;z-index:2}
  .es-lessonctxl{display:flex;flex-direction:column;gap:3px;min-width:0}
  .es-lessonwas{font-size:12px;line-height:1.5;font-style:italic;color:var(--ink-3);
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .es-lessonjump{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .es-jump{font:inherit;font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer;
    border:1.5px solid var(--line);border-radius:99px;padding:4px 12px;background:var(--card)}
  .es-jump:hover{border-color:var(--green)}
  .es-jump.on{border-color:var(--green);background:var(--green-soft);color:var(--green-dk)}
  .es-lessonp.lead{font-size:15px;line-height:1.65}
  .es-conceptset{display:flex;flex-direction:column;gap:9px}
  .es-concept{font-size:14px;line-height:1.6;color:var(--ink-2);margin:0}
  .es-concept b{color:var(--ink)}
  .es-conceptset.focus,.es-chain.focus,.es-lessonsec.focus{outline:2px solid var(--green);outline-offset:6px;
    border-radius:8px}
  .es-lessonmore{display:flex;flex-direction:column;gap:13px;align-items:flex-start;
    border-top:1.5px solid var(--line);padding-top:12px}
  .es-tryrighth{font-family:var(--disp);font-weight:600;font-size:14.5px;color:var(--green-dk)}
  .es-lessonarg{font-family:var(--disp);font-weight:600;font-size:16px;color:var(--ink)}
  .es-lessonsec{display:flex;flex-direction:column;gap:7px}
  .es-lessonp{font-size:14px;line-height:1.62;color:var(--ink);margin:0}
  .es-lessonnote{font-size:12.5px;line-height:1.55;font-weight:600;color:var(--ink-3);margin:0}
  /* the relationship, one step at a time */
  .es-chain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
  .es-chainstep{position:relative;font-size:13.5px;line-height:1.5;font-weight:600;color:var(--ink);
    border:1.5px solid var(--green-soft);background:#FBFEFC;border-radius:11px;padding:9px 14px;
    opacity:0;animation:eschain .34s ease forwards}
  .es-chainstep+.es-chainstep{margin-top:20px}
  .es-chainstep+.es-chainstep::before{content:"";position:absolute;left:24px;top:-17px;width:1.5px;height:14px;
    background:var(--green)}
  .es-chainstep+.es-chainstep::after{content:"";position:absolute;left:20.5px;top:-7px;width:8px;height:8px;
    border-right:1.5px solid var(--green);border-bottom:1.5px solid var(--green);transform:rotate(45deg)}
  @keyframes eschain{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.es-chainstep{opacity:1;animation:none}}
  .es-contrast{border:1.5px solid var(--line);border-radius:13px;padding:12px 15px;display:flex;
    flex-direction:column;gap:7px}
  .es-contrasth{font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:lowercase;color:var(--ink-3)}
  .es-contrastrow{display:flex;gap:10px;align-items:baseline;font-size:13.5px;line-height:1.5}
  .es-contrastrow b{color:var(--ink);min-width:132px}
  .es-contrastrow span{color:var(--ink-2)}
  .es-tryopts{display:flex;flex-direction:column;gap:8px}
  .es-try{text-align:left;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;
    border:1.5px solid var(--line);border-radius:12px;padding:10px 15px;background:var(--card)}
  .es-try:hover:not(:disabled){border-color:var(--green)}
  .es-try:disabled{cursor:default}
  .es-try.right{border-color:var(--green);background:var(--green-soft);color:var(--green-dk)}
  .es-try.wrong{border-color:var(--gold-dk);background:var(--gold-soft)}
  .es-tryright,.es-tryrepair{display:flex;flex-direction:column;gap:9px;align-items:flex-start;margin-top:4px;
    border-radius:12px;padding:11px 15px}
  .es-tryright{border:1.5px solid var(--green);background:var(--green-soft)}
  .es-tryrepair{border:1.5px solid var(--gold-dk);background:var(--gold-soft)}

  .es-restnote{font-size:12px;line-height:1.5;font-weight:600;color:var(--ink-2);margin-top:4px}
  /* the response map: what each section argues, and what it says */
  .es-mapwrap{display:flex;flex-direction:column}
  .es-maprow{display:flex;align-items:flex-start;gap:2px}
  .es-mapitem{align-items:flex-start}
  .es-maptext{display:flex;flex-direction:column;gap:2px;min-width:0}
  .es-maparg{font-size:11.5px;line-height:1.4;font-weight:600;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .es-mapdot{margin-top:4px}
  .es-mappeek{font:inherit;font-size:10.5px;font-weight:800;color:var(--ink-3);background:none;border:none;border-radius:7px;padding:6px 5px;cursor:pointer;flex:none}
  .es-mappeek:hover{color:var(--green-dk);background:var(--green-soft)}
  .es-mappeek.on{color:var(--green-dk)}
