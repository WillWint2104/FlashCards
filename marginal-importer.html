<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marginal · import questions</title>
<!--
  THE IMPORTER. A teacher surface, separate from the student app on purpose: it
  shares no code with it, so nothing here can change what a student sees.

  SLICE 1 IS READ ONLY. Choose, Parse, Validate, Resolve references and Review
  are wired to the real contract modules. There is no store and no write path in
  this file at all. Publish is drawn as the step it is and cannot be reached.

  Every rule applied here is applied by tools/contract/*.js, running in the
  browser through tools/contract/bundle.js. There is no second implementation of
  validation, resolution or admission in this file, and there must never be one.
-->
<style>
  :root{
    --bg:#EEF3F5; --card:#FFFFFF;
    --ink:#3C4A4A; --ink-2:#7A8A88; --ink-3:#AEBAB8;
    --green:#1CC47D; --green-dk:#14A368; --green-soft:#E4F9EF;
    --line:#E7EDED; --amber:#B3730C; --amber-soft:#FDF3E3;
    --red:#B3403C; --red-soft:#FBEDEC;
    --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  header{display:flex;align-items:center;gap:12px;padding:16px 32px;background:var(--card);border-bottom:1px solid var(--line)}
  .mk{width:28px;height:28px;border-radius:9px;background:var(--green);flex:none;box-shadow:0 3px 0 var(--green-dk)}
  .wordmark{font-weight:800;font-size:17px;letter-spacing:-.2px}
  .where{margin-left:auto;font-size:13px;color:var(--ink-2);font-weight:700}
  main{max-width:1080px;margin:0 auto;padding:26px 32px 56px}
  h1{font-size:23px;font-weight:800;letter-spacing:-.3px;margin:0 0 4px}
  .lede{font-size:14px;color:var(--ink-2);font-weight:600;margin:0 0 22px;max-width:72ch}

  .rail{display:flex;gap:8px;margin:0 0 22px;flex-wrap:wrap}
  .step{display:flex;align-items:center;gap:9px;background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:7px 15px 7px 8px;font-size:12.5px;font-weight:700;color:var(--ink-3);cursor:default}
  .step b{width:22px;height:22px;border-radius:50%;background:var(--bg);color:var(--ink-3);display:grid;place-items:center;font-size:11.5px;font-weight:800}
  .step.on{border-color:var(--green);color:var(--ink)}
  .step.on b{background:var(--green);color:#fff}
  .step.done{color:var(--ink-2);cursor:pointer}
  .step.done b{background:var(--green-soft);color:var(--green-dk)}
  .step.write{border-style:dashed}

  .cols{display:grid;grid-template-columns:1.45fr 1fr;gap:18px;align-items:start}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px 20px}
  .card + .card{margin-top:18px}
  .card h2{font-size:14px;font-weight:800;margin:0 0 3px}
  .card .sub{font-size:12.5px;color:var(--ink-2);font-weight:600;margin:0 0 14px}
  .count{font-size:19px;font-weight:800;letter-spacing:-.2px;margin:0 0 2px}
  .count span{color:var(--green-dk)} .count em{font-style:normal;color:var(--red)}

  .grp{border-top:1px solid var(--line);padding:14px 0}
  .grp:first-of-type{border-top:0}
  .grph{display:flex;align-items:baseline;gap:10px;margin-bottom:3px}
  .grph .n{font-size:13px;font-weight:800;flex:1}
  .grph .c{font-size:11.5px;font-weight:800;color:var(--red);background:var(--red-soft);border-radius:99px;padding:3px 10px}
  .grph .c.w{color:var(--amber);background:var(--amber-soft)}
  .grpw{font-size:12.5px;color:var(--ink-2);font-weight:600;margin:0 0 8px}

  .w{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:12.5px}
  .w:first-of-type{border-top:0}
  .w .k{width:18px;flex:none;font-weight:800;text-align:center}
  .w .k.add{color:var(--green-dk)} .w .k.same{color:var(--ink-3)} .w .k.stop{color:var(--red)}
  .w .k.warn{color:var(--amber)}
  .w .t{flex:1;font-weight:700}
  .w .t small{display:block;font-weight:600;color:var(--ink-2);font-size:11.5px}
  .w .t code,code{font-family:var(--mono);font-size:11px;color:var(--ink-2)}

  .tag{font-size:11.5px;font-weight:800;border-radius:99px;padding:4px 11px;white-space:nowrap}
  .good{background:var(--green-soft);color:var(--green-dk)}
  .warnt{background:var(--amber-soft);color:var(--amber)}
  .badt{background:var(--red-soft);color:var(--red)}
  .neutral{background:var(--bg);color:var(--ink-2)}
  .blockt{background:var(--bg);color:var(--ink-2);border:1.5px dashed var(--ink-3);padding:3px 10px}

  .btnrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
  .btn{font:inherit;font-size:13px;font-weight:800;border-radius:12px;padding:10px 16px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  .btn.primary{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 2px 0 var(--green-dk)}
  .btn[disabled]{background:var(--bg);border-color:var(--line);color:var(--ink-3);box-shadow:none;cursor:not-allowed}
  .note{font-size:12px;color:var(--ink-2);font-weight:600;margin:10px 0 0}
  .quiet{font-size:12.5px;color:var(--ink-2);font-weight:600;margin:0 0 11px}
  .quiet b{color:var(--ink)}
  .rule{font-size:12.5px;color:var(--ink-2);font-weight:600;background:var(--bg);border-radius:12px;padding:11px 14px;margin:14px 0 0}
  .rule b{color:var(--ink)}
  .invariant{background:var(--green-soft);border:1.5px solid #CFF0E0;border-radius:14px;padding:13px 16px;margin-top:18px;font-size:13px;font-weight:700;color:var(--green-dk)}
  .banner{border-radius:18px;padding:16px 20px;margin-bottom:18px;border:1.5px solid var(--line);background:var(--card)}
  .banner .hd{font-size:19px;font-weight:800;letter-spacing:-.2px;margin:0 0 3px}
  .banner .bd{font-size:13px;font-weight:600;color:var(--ink-2);margin:0;max-width:74ch}
  .banner.good{background:var(--green-soft);border-color:#CFF0E0}
  .banner.good .hd,.banner.good .bd{color:var(--green-dk)}
  .banner.stop{background:var(--red-soft);border-color:#F2D8D6}
  .banner.stop .hd{color:var(--red)}
  .banner.warn{background:var(--amber-soft);border-color:#F2E2C6}
  .banner.warn .hd{color:var(--amber)}
  .drop{border:2px dashed var(--ink-3);border-radius:16px;padding:26px 20px;text-align:center;background:var(--bg)}
  .drop p{margin:0 0 4px;font-size:13.5px;font-weight:700}
  .drop small{font-size:12px;color:var(--ink-2);font-weight:600}
  .ex{background:var(--bg);border-radius:12px;padding:10px 13px;margin-top:8px;font-size:12.5px}
  .ex .msg{font-weight:700;display:block}
  .ex .at{font-family:var(--mono);font-size:11px;color:var(--ink-2);display:block;margin-top:3px}
  .more{font:inherit;font-size:12px;font-weight:800;color:var(--green-dk);background:none;border:0;padding:8px 0 0;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="mk"></div><div class="wordmark">Marginal</div>
  <div class="where" id="where">Teacher tools · import questions</div>
</header>
<main>
  <h1 id="h1">Choose files</h1>
  <p class="lede" id="lede">Nothing is written until the last step, and this build cannot write at all.</p>
  <div class="rail" id="rail"></div>
  <div id="screen"></div>
</main>
<script>
// GENERATED by tools/contract/bundle.js from tools/contract/*.js. Do not edit.
// Every rule the importer applies is the rule in those files, running here.
(function () {
  "use strict";
  var __defs = {}, __cache = {};
  function __stub(what, why) {
    return new Proxy({}, { get: function (t, k) {
      throw new Error('the importer reached for ' + what + '.' + String(k) + ', which is not available in a browser. ' + why);
    } });
  }
  function __require(id) {
    if (id === 'fs') return __stub('fs', 'The importer is given file contents by the page, and never reads a path.');
    if (id === 'path') return __stub('path', 'There are no paths here.');
    if (id === './libraries.js') return __stub('libraries',
      'It walks the content files to build the manifest, which is design time work. The generated manifest and registries are supplied instead.');
    if (__cache[id]) return __cache[id].exports;
    if (!__defs[id]) throw new Error('no such module in the contract bundle: ' + id);
    var m = { exports: {} };
    __cache[id] = m;
    __defs[id](m, m.exports, __require);
    return m.exports;
  }

__defs["./fields.js"] = function (module, exports, require) {
// THE FIELD DEFINITION. One file, and everything else about the contract is
// generated from it: the JSON Schema, the authoring guide, the three templates,
// and the enum and ref checks the validator runs.
//
// It exists because four hand-maintained descriptions of one format drift, and
// the drift is invisible until an external author follows the guide and the
// validator rejects what they wrote. `tests/t18.mjs` asserts the generated
// artefacts match this file, so drift fails a gate rather than a person.
//
// Every entry answers the ten questions an external author has, in the order
// they ask them:
//
//   required      is this needed, and needed for what
//   owner         question, pathway, area, package or shared library
//   type          and allowed values
//   refTo         which library its ids may name
//   means         what it is FOR, pedagogically, not what type it is
//   surface       which student-facing surface consumes it
//   omission      leaving it out: invalid, or a capability not reached
//   studentProse  whether a student reads these words
//   good / bad    one of each, drawn from real content where possible
//   answerSpecific  whether the text may be specific to the answer to THIS
//                   question. False is the stronger claim and the one most
//                   fields make: a frame, a starter, a guidance line or a
//                   worked example must be about a different context, because
//                   scaffolding is not answer assembly and nothing in it may be
//                   pasted into a student's sentence.
//
// `omission` is the field that makes the format honest. "invalid" means the
// package will not import. A capability name means the package imports and does
// not reach that capability, and the readiness report says so by name.
//
// "level:displayable" is the third answer, and it exists because vocabulary has
// two consumers with different needs. The Learn surface lists a concept's defined
// terms and needs a term and a subject meaning. The vocabulary panel needs all
// four fields, because its whole contract is that a student never meets a term
// without a meaning they can read. A record can therefore be complete enough to
// teach with and not complete enough to offer as vocabulary, and collapsing that
// into one word would either hide fourteen usable definitions or display fourteen
// half-written ones.

// The six capabilities, in the order a question climbs them. Locked by decision
// 6: readiness is not one scalar, because two questions that differ by an entire
// tier of authored support must not report alike.
const CAPABILITIES = [
  { id: "importable", means: "the package parses, resolves and can be stored" },
  { id: "writing-ready", means: "a student can be given the question and write against it" },
  { id: "pathway-guided", means: "a student can choose between authored arguments and be guided through one" },
  { id: "learning-complete", means: "a student who does not know the content can be taught it here" },
  { id: "assessment-complete", means: "the student can see what the answer must accomplish and how it is marked" },
  { id: "evidence-complete", means: "every argument has evidence carrying a source that was checked" },
];

// Enums the libraries define are named, never copied: the validator reads the
// values out of the manifest at run time, so adding a sentence shape family or
// a directive is authoring rather than a code change. The ones no library
// defines are listed here in full, once.
const ENUMS = {
  vocabularyRole: { from: "manifest", key: "vocabularyRoles" },
  directive: { from: "manifest", key: "directives" },
  connector: { from: "manifest", key: "connectors" },
  slot: { from: "manifest", key: "slotKeys" },
  capability: { values: CAPABILITIES.map(c => c.id) },
  originType: { values: ["bundled", "imported"] },
  reviewState: { values: ["draft", "in-review", "in-source", "approved"] },
  publication: { values: ["unpublished", "published", "withdrawn"] },
  mechanismStatus: { values: ["authored", "none-required", "unreviewed"] },
  learningStatus: { values: ["authored", "none-required", "unreviewed"] },
  answerMode: { values: ["causal", "judgement"] },
  relation: { values: ["shapes", "affects", "constrains", "enables"] },
  contributionRole: { values: ["support", "limitation", "conditional"] },
  lean: { values: ["positive", "qualified", "negative"] },
  ladderRung: { values: ["hint", "needs", "direction", "frame", "starter", "example"] },
  markingSource: { values: ["authored", "generated"] },
  conceptKind: { values: ["domain", "supporting"] },
  requiresTeaching: { values: ["always", "contextual", "never"] },
  // Evidence roles are their own list, with the same four values vocabulary uses
  // today. They were an alias, which read as one idea and is two: a vocabulary
  // role says what a term is for in the argument, and an evidence role says what
  // an item is doing in the response. They may diverge, and an alias would have
  // made that a silent change to both.
  evidenceRole: { values: ["relationship-support", "strategy-example", "outcome-evidence", "topic-context"] },
  // Every command the content recognises. Unknown is an error; known and
  // unsupported is a capability fact. The registry is generated in
  // tools/contract/directives.js and published at docs/contract/directive-registry.json.
  knownDirective: { from: "registry", key: "commands" },
};

// The libraries a ref may name. `scope` is the part the runtime can actually
// resolve from, and readiness is only allowed to inspect those scopes: a report
// that walks a scope the engine never reaches measures something no student can
// be given.
const LIBRARIES = {
  vocabulary: { record: "VocabularyRecord", scope: "question, area, pathway" },
  concepts: { record: "ConceptRecord", scope: "pathway, learning" },
  lessons: { record: "LessonRecord", scope: "pathway" },
  evidence: { record: "EvidenceRecord", scope: "pathway" },
  syllabus: { record: "SyllabusNode", scope: "question, area, pathway" },
  resources: { record: "ResourceRecord", scope: "question, area, pathway" },
  sentenceShapes: { record: "SentenceShape", scope: "engine" },
};

// Which top-level containers must be present, and which may honestly be null.
// A write-only question has no decode panel and no model answer, and saying so
// with null is the format telling the truth rather than carrying empty objects
// that look authored. Nullable here means "absent is a capability fact"; it never
// means "optional to think about".
const CONTAINERS = {
  required: ["schema", "contractVersion", "origin", "provenance", "requires", "question",
             "relationship", "areas", "pathways", "marking"],
  nullable: ["decode", "requirements", "coreAnswer", "workingAnswer", "reasoning", "provides"],
};

const F = [];
const f = o => { F.push(o); return o; };

// ===========================================================================
// ENVELOPE
// ===========================================================================
f({ path: "schema", owner: "package", type: "const", value: "marginal.question-package",
  required: true, omission: "invalid", studentProse: false, answerSpecific: false,
  means: "what kind of file this is: the package type. A validator reads this before anything else, so it never guesses at content it cannot interpret. Shared libraries and manifests carry their own value here, which is how one directory holds several kinds of file.",
  surface: "none",
  good: '"marginal.question-package"', bad: '"question" — a name a reader guesses at is not a format' });
f({ path: "contractVersion", owner: "package", type: "version", required: true, omission: "invalid",
  studentProse: false, answerSpecific: false,
  means: "the contract this package was authored against, as major.minor. The major number is the compatibility promise: a reader that does not know it refuses the file rather than interpreting fields it may be wrong about. The minor number rises when the contract gains something a v1 reader can safely ignore, so a package authored later than the reader still validates against what the reader does know, and says so.",
  surface: "none",
  good: '"1.0"', bad: '"1" or 1 — a major with no minor cannot say which additions it was authored against, and a number cannot hold "1.10"' });

f({ path: "origin.type", owner: "package", type: "enum", enumName: "originType", required: true,
  omission: "invalid", studentProse: false, answerSpecific: false,
  means: "whether the question shipped with the application or arrived through an import. Where a question came from is metadata beside its id and never part of it.",
  surface: "none", good: '"imported"', bad: '"mkt" — a namespace prefix belongs nowhere near origin' });
f({ path: "origin.packageId", owner: "package", type: "string", required: false, omission: "none",
  studentProse: false, answerSpecific: false, means: "the authoring bundle this question arrived in, for tracing a set back to its source.",
  surface: "none", good: '"stgeorge.bus.2026t1"', bad: '"latest"' });
f({ path: "origin.author", owner: "package", type: "string", required: false, omission: "none",
  studentProse: false, answerSpecific: false, means: "who authored the question, for review rather than for display.",
  surface: "none", good: '"J. Halloran"', bad: '"Marginal"' });
f({ path: "origin.authoredAt", owner: "package", type: "date", required: false, omission: "none",
  studentProse: false, answerSpecific: false, means: "when it was authored. A date, not a timestamp: nothing needs the minute.",
  surface: "none", good: '"2026-02-14"', bad: '"14/2/26"' });

f({ path: "provenance.reviewState", owner: "package", type: "enum", enumName: "reviewState",
  required: true, omission: "invalid", studentProse: false, answerSpecific: false,
  means: "how far through review this question is. A draft may be imported and is never served to a student.",
  surface: "none", good: '"approved"', bad: '"ready"' });
f({ path: "provenance.publication", owner: "package", type: "enum", enumName: "publication",
  required: true, omission: "invalid", studentProse: false, answerSpecific: false,
  means: "whether a student may be given this question at all, independent of how complete it is.",
  surface: "the question picker", good: '"published"', bad: '"live"' });
f({ path: "provenance.notes", owner: "package", type: "string", required: false, omission: "none",
  studentProse: false, answerSpecific: false, means: "anything the next reviewer needs to know. Never rendered.",
  surface: "none", good: '"Band descriptors still to come from the faculty."', bad: '"TODO"' });

// ===========================================================================
// REQUIRES AND PROVIDES
// ===========================================================================
f({ path: "requires.<library>", owner: "package", type: "string[]", required: false,
  refTo: "any", omission: "none", studentProse: false, answerSpecific: false,
  means: "every shared id this package references, by library. Generated from the package rather than authored beside it: a dependency list that can disagree with the package it describes is a second source of truth. The importer recomputes it and reports any difference in both directions, so an omitted library is caught as a mismatch rather than as a missing field.",
  surface: "none",
  good: '"concepts": ["business.concept.people"]',
  bad: 'a list that omits an id the package references. The validator recomputes it and reports REQUIRES_MISMATCH' });
f({ path: "provides.<library>", owner: "package", type: "record map", required: false,
  refTo: "any", omission: "none",
  studentProse: false, answerSpecific: false,
  means: "shared records this package contributes to a library. A package may bring a record the library does not have. It may never replace one it does: a definition three other questions point at is not this import's to rewrite.",
  surface: "wherever the library is consumed",
  good: 'a vocabulary record for a term nothing has defined yet',
  bad: 'a second copy of business.concept.people with different wording. That is PROVIDES_CONFLICT' });

// ===========================================================================
// QUESTION
// ===========================================================================
f({ path: "question.id", owner: "question", type: "id", pattern: "^[a-z0-9]+(-[a-z0-9]+)*$",
  required: true, omission: "invalid", studentProse: false, answerSpecific: false,
  means: "the stable name of this question in one namespace shared by bundled and imported questions alike. A collision is an import-blocking error and never an implicit overwrite.",
  surface: "none, and it is written into every saved draft, so it can never change",
  good: '"mkt-01"', bad: '"Mkt 01!" — spaces and case make two ids a person reads as one' });
f({ path: "question.subject", owner: "question", type: "id", pattern: "^[a-z0-9]+(_[a-z0-9]+)*$", required: true, omission: "invalid",
  studentProse: false, answerSpecific: false, means: "which subject's marking criteria, paragraph models and libraries apply.",
  surface: "the subject picker", good: '"business_studies"', bad: '"Business"' });
f({ path: "question.topicRef", owner: "question", type: "ref", refTo: "syllabus", required: false,
  omission: "capability:writing-ready", studentProse: false, answerSpecific: false,
  means: "the syllabus node this question sits in. A ref, because the engine used to recover the topic from a display label with a keyword table: four word lists, first match wins, null if none hit.",
  surface: "the study content panel, which loads the topic's core content",
  good: '"business.marketing"', bad: '"Marketing" — a label a table then guesses a key from' });
f({ path: "question.topicLabel", owner: "question", type: "string", required: false, omission: "none",
  studentProse: true, answerSpecific: false,
  means: "the topic in words, for a subject that has no syllabus library at all. Never present beside topicRef: a question carries a ref or a label.",
  surface: "the question header",
  good: '"Features of ancient societies: religion and belief"',
  bad: 'present at the same time as topicRef' });
f({ path: "question.directive", owner: "question", type: "enum", enumName: "directive", required: true,
  omission: "invalid", studentProse: true, answerSpecific: false,
  means: "the command verb, which decides the directive family and therefore every slot label, sentence shape and piece of guidance downstream. Nothing else decides it. It must be in the directive registry: a command outside it does not import, and a command in it that assigns no family gives a valid question whose family-dependent guidance is withheld rather than defaulted.",
  surface: "the decode panel, the slot labels, the sentence shapes",
  good: '"explain", which assigns the causal family and has four authored sentence shapes',
  bad: '"ponder", which the registry does not list. "compare" is legal and unsupported: the question imports and is offered no argument scaffolding, rather than being scaffolded as a cause' });
f({ path: "question.text", owner: "question", type: "string", required: true, omission: "invalid",
  studentProse: true, answerSpecific: false,
  means: "the question exactly as a student reads it. Every decode highlight anchors into this string.",
  surface: "the question header, the decode panel, the marking payload",
  good: '"Explain how target markets affect e-marketing, people, processes and physical evidence."',
  bad: 'a paraphrase that no longer contains the words the highlights anchor to' });
f({ path: "question.marks", owner: "question", type: "integer", range: [1, 40], required: true,
  omission: "invalid", studentProse: true, answerSpecific: false,
  means: "what the question is worth, which sets the expected length and the band table.",
  surface: "the question header, the marking request", good: "20", bad: "0" });
// Added in 1.1. Authored on four questions and dropped by the exporter until
// now, which meant a bundled question exported and re-imported lost where it
// came from. Provenance a student never sees and a teacher relies on.
f({ path: "question.note", owner: "question", type: "string", required: false, omission: "none",
  studentProse: false, answerSpecific: false,
  means: "where this question came from, in the teacher's words. Not shown to a student.",
  surface: "the teacher's view of the question",
  good: '"2024 HSC Section IV question."',
  bad: '"a good one" — a note nobody can act on is not provenance' });
// Added in 1.1. What this question's areas are collectively called, which two
// questions author and the exporter dropped.
f({ path: "question.areasLabel", owner: "question", type: "string", required: false, omission: "none",
  studentProse: true, answerSpecific: true,
  means: "the collective name for this question's areas, used where the screen has to name them as a group.",
  surface: "the area chooser",
  good: '"financial strategy area"',
  bad: '"areas" — the point of the field is that this question calls them something' });
f({ path: "question.terms.first", owner: "question", type: "string", required: false,
  omission: "capability:pathway-guided", studentProse: true, answerSpecific: true,

<script>
// THE IMPORTER, SLICE 1: THE READ ONLY PIPELINE.
//
// Choose -> Parse -> Validate -> Resolve references -> Review, wired to the real
// contract modules through window.MarginalContract. Review is as far as this
// build goes. There is no store, no write adapter and no publish call anywhere
// in this file, and the Publish step is drawn as unreachable rather than
// disabled, because it does not exist yet.
//
// THE ONE RULE THIS FILE IS WRITTEN AROUND: it decides nothing. Every verdict,
// severity, capability, reference outcome and admission state comes from
// validate(), admit() and plan(). This file arranges what they return. When a
// question here is "is this valid", the answer is a field on a report; it is
// never a condition written in this file. That is what keeps the importer and
// the rest of Marginal from drifting into two sets of rules.
//
// State is one object. Going back does not re-read the files and does not
// re-run anything: the batch is parsed once and the reports are computed once,
// so the screens are views of the same result rather than five chances to get a
// different answer.
(function () {
  "use strict";
  var C = window.MarginalContract;
  var D = window.MarginalImportData; // the generated manifest and registries

  var STEPS = ["Choose files", "Parse", "Validate", "Resolve references", "Review changes", "Publish"];
  // The rail is a short label per step; the page heading is the frozen wording
  // from the design. They are different lengths on purpose and are not derived
  // from each other.
  var HEADINGS = ["Choose the packages to import", "Parse packages", "Validate packages",
                  "Resolve references", "Review changes", "Publish"];
  var state = { step: 0, files: [], reports: null, plan: null, reached: 0,
    // Publication. `busy` is set the moment Publish is pressed and is never
    // cleared while an attempt is in flight, so one plan cannot be submitted
    // twice by pressing twice.
    busy: false, result: null };

  // ---- helpers -------------------------------------------------------------
  var $ = function (sel) { return document.querySelector(sel); };
  var el = function (tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };
  // Everything from a file is untrusted text. It is put in the page as TEXT,
  // never as markup, so a package cannot script the importer.
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var plural = function (n, one, many) { return n + " " + (n === 1 ? one : (many || one + "s")); };
  var row = function (mark, title, sub) {
    return '<div class="w"><span class="k ' + mark + '">' +
      { add: "+", same: "=", stop: "x", warn: "!" }[mark] + '</span><span class="t">' + esc(title) +
      (sub ? "<small>" + esc(sub) + "</small>" : "") + "</span></div>";
  };

  // ---- the pipeline, run once per batch ------------------------------------
  // Parse and validate happen together because a file that does not parse has no
  // report, and the screens after Parse have to account for it either way.
  function runPipeline() {
    state.reports = state.files.map(function (f) {
      var r = { source: f.name, bytes: f.bytes, pkg: null, parseError: null, report: null };
      try { r.pkg = JSON.parse(f.text); }
      catch (e) { r.parseError = e.message; return r; }
      if (!r.pkg || typeof r.pkg !== "object" || Array.isArray(r.pkg)) {
        r.parseError = "the file parsed to " + (Array.isArray(r.pkg) ? "a list" : typeof r.pkg) +
          ", and a package is an object";
        r.pkg = null;
        return r;
      }
      r.report = C.validate(r.pkg, D.manifest, { registry: D.directives });
      return r;
    });
    // The admission plan. Built from the packages that parsed, against the real
    // question registry. Nothing else in this file may decide what is
    // publishable, so nothing else in this file asks.
    var entries = state.reports.filter(function (r) { return r.pkg; })
      .map(function (r) { return { source: r.source, pkg: r.pkg, report: r.report }; });
    // The destination is the bank that SHIPPED plus everything published here.
    // A question imported last week is as much a collision as one that came with
    // the app, so admission is run against the live registry rather than the
    // generated one.
    // Read fresh on every run of the pipeline, and deliberately NOT kept for
    // publication: see the note where apply() is called.
    var dest = C.store.destination(D.questions);
    var live = C.registryOf(dest);
    state.plan = entries.length ? C.plan(entries, live, D.manifest, { registry: D.directives }) : null;
  }
  var entryFor = function (source) {
    if (!state.plan) return null;
    for (var i = 0; i < state.plan.entries.length; i++)
      if (state.plan.entries[i].source === source) return state.plan.entries[i];
    return null;
  };

  // ---- the rail ------------------------------------------------------------
  function rail() {
    var r = $("#rail");
    r.innerHTML = "";
    STEPS.forEach(function (name, i) {
      var cls = "step" + (i === state.step ? " on" : i < state.step ? " done" : "") +
        (i === 5 ? " write" : "");
      var n = el("div", cls);
      n.innerHTML = '<b>' + (i < state.step ? "&check;" : i + 1) + "</b> " + esc(name);
      // Going back is free and re-runs nothing. Going forward past where the
      // batch has reached is not offered, because the later screens would be
      // describing a batch that has not been read.
      if (i < state.step) n.addEventListener("click", function () { go(i); });
      r.appendChild(n);
    });
  }
  function go(i) { state.step = i; state.reached = Math.max(state.reached, i); render(); }

  // ---- screens -------------------------------------------------------------
  var SCREENS = [choose, parsed, validated, resolved, review, publishStep];

  function render() {
    rail();
    $("#h1").textContent = HEADINGS[state.step];
    var s = $("#screen");
    s.innerHTML = "";
    SCREENS[state.step](s);
  }

  // 1 ------------------------------------------------------------------------
  function choose(s) {
    $("#lede").textContent = "Choosing a file reads its first two fields, so this list can say what " +
      "each one is. Nothing else is read until the next step.";
    var left = el("div");
    var card = el("div", "card");
    card.innerHTML = '<h2>Package files</h2><p class="sub">One question per file. ' +
      'JSON only, and each file is read where it sits.</p>';
    var drop = el("div", "drop");
    drop.innerHTML = "<p>Choose the package files to import</p><small>Or drop them here</small>";
    var input = el("input");
    input.type = "file"; input.multiple = true; input.accept = ".json,application/json";
    input.id = "filepick";
    input.style.marginTop = "14px";
    drop.appendChild(input);
    card.appendChild(drop);

    if (state.files.length) {
      var list = el("div");
      list.style.marginTop = "16px";
      state.files.forEach(function (f) {
        list.innerHTML += row("add", f.name, f.head);
      });
      card.appendChild(list);
    }
    left.appendChild(card);

    var right = el("div");
    var go1 = el("div", "card");
    go1.innerHTML = '<h2>What happens next</h2>' +
      '<p class="quiet">Parse reads each file and says whether it is a package Marginal can read at ' +
      'all. Nothing is checked against your question bank until Review.</p>';
    var btn = el("button", "btn primary", state.files.length ?
      "Continue with " + plural(state.files.length, "package") : "Continue");
    btn.id = "continue";
    btn.disabled = !state.files.length;
    var brow = el("div", "btnrow");
    brow.appendChild(btn);
    go1.appendChild(brow);
    go1.innerHTML += '<p class="note">This build is read only. It stops at Review and cannot write.</p>';
    right.appendChild(go1);

    var cols = el("div", "cols");
    cols.appendChild(left); cols.appendChild(right);
    s.appendChild(cols);

    // Re-query: innerHTML above replaced the node held in `btn`.
    $("#continue").addEventListener("click", function () { runPipeline(); go(1); });
    input.addEventListener("change", function () { take(input.files); });
    drop.addEventListener("dragover", function (e) { e.preventDefault(); });
    drop.addEventListener("drop", function (e) {
      e.preventDefault();
      take(e.dataTransfer && e.dataTransfer.files);
    });
  }

  function take(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;
    var read = files.map(function (f) {
      return f.text().then(function (text) {
        // The two fields the list shows, and only those. Reading more here would
        // make the claim on the screen false.
        var head = "";
        try {
          var j = JSON.parse(text);
          head = (j && j.schema ? j.schema : "no schema field") +
            (j && j.contractVersion ? " · contract " + j.contractVersion : " · no version");
        } catch (e) { head = "not readable as JSON"; }
        return { name: f.name, text: text, bytes: text.length, head: head };
      });
    });
    Promise.all(read).then(function (loaded) {
      state.files = state.files.concat(loaded);
      state.reports = null; state.plan = null;
      render();
    });
  }

  // 2 ------------------------------------------------------------------------
  function parsed(s) {
    $("#lede").textContent = "Whether each file is a package Marginal can read. Nothing here has been " +
      "checked against your question bank.";
    var okd = state.reports.filter(function (r) { return r.pkg; });
    var bad = state.reports.filter(function (r) { return !r.pkg; });
    var left = el("div");
    var c = el("div", "card");
    // Both counts, always. Showing only the failures when there are failures
    // makes the batch look smaller than it is, which is the thing every screen
    // in this importer is written not to do.
    c.innerHTML = '<p class="count"><span>' + plural(okd.length, "package") + "</span> read" +
      (bad.length ? ', <em>' + plural(bad.length, "file") + " could not be read</em>" : "") + "</p>" +
      '<p class="sub">Read means parsed and identified. It does not mean valid.</p>' +
      okd.map(function (r) {
        return row("add", r.pkg.question && r.pkg.question.id ? String(r.pkg.question.id) : "(no question id)",
          r.source + " · " + (r.pkg.schema || "no schema") + " · contract " + (r.pkg.contractVersion || "none"));
      }).join("") +
      bad.map(function (r) { return row("stop", r.source, r.parseError); }).join("");
    left.appendChild(c);
    var right = el("div");
    var n = el("div", "card");
    n.innerHTML = '<h2>Next</h2><p class="quiet">Validate checks each package against the contract: ' +
      'required fields, values, references inside the file. It does not look at your bank.</p>';
    var b = el("button", "btn primary", "Continue to Validate");
    b.id = "next"; b.disabled = !okd.length;
    var br = el("div", "btnrow"); br.appendChild(b); n.appendChild(br);
    right.appendChild(n);
    var cols = el("div", "cols"); cols.appendChild(left); cols.appendChild(right);
    s.appendChild(cols);
    $("#next").addEventListener("click", function () { go(2); });
    back(s, 0);
  }

  // 3 ------------------------------------------------------------------------
  function validated(s) {
    $("#lede").textContent = "Every package against the contract. A package is rejected or it is not, " +
      "and the reason is always a rule with a name.";
    var left = el("div");
    var head = el("div", "card");
    var okd = state.reports.filter(function (r) { return r.report; });
    var rejected = okd.filter(function (r) { return r.report.counts.error; });
    head.innerHTML = '<h2>Verdicts</h2><p class="sub">One line per package, from the validator.</p>' +
      okd.map(function (r) {
        var v = r.report;
        var tag = v.counts.error ? '<span class="tag badt">' + plural(v.counts.error, "error") + "</span>"
          : v.counts.warning ? '<span class="tag warnt">' + plural(v.counts.warning, "warning") + "</span>"
          : '<span class="tag good">valid</span>';
        return '<div class="w"><span class="k ' + (v.counts.error ? "stop" : "add") + '">' +
          (v.counts.error ? "x" : "+") + '</span><span class="t">' + esc(v.package) +
          "<small>" + esc(r.source) + " · " + esc(v.verdict) + "</small></span>" + tag + "</div>";
      }).join("");
    left.appendChild(head);

    // Grouped by what to do about them, not by which check found them. The
    // grouping is tools/contract/diagnostics.js, so the screen cannot invent a
    // category and a new validator code cannot silently stop being described.
    rejected.forEach(function (r) {
      var c = el("div", "card");
      var errs = r.report.findings.filter(function (f) { return f.severity === "error"; });
      var codes = {};
      errs.forEach(function (f) { codes[f.code] = 1; });
      var groups = C.groupErrors(r.report.findings);
      var warns = r.report.findings.filter(function (f) { return f.severity === "warning"; });
      c.innerHTML = "<h2>" + esc(r.source) + "</h2>" +
        '<p class="sub">' + plural(errs.length, "error") + " across " +
        plural(Object.keys(codes).length, "rule") + ". Grouped by what to do about them, " +
        "not by which check found them.</p>";
      groups.forEach(function (g) {
        var grp = el("div", "grp");
        // The explanation is the primary line. The code and the path sit under
        // it, small, because they are how you find the field and not what is
        // wrong with it.
        var body = g.findings.map(function (f) {
          return '<div class="ex"><span class="msg">' + esc(f.message) + "</span>" +
            '<span class="at">' + esc(f.code) + (f.path ? " · " + esc(f.path) : "") + "</span></div>";
        });
        grp.innerHTML = '<div class="grph"><span class="n">' + esc(g.title) +
          '</span><span class="c">' + g.findings.length + "</span></div>" +
          '<p class="grpw">' + esc(g.says) + "</p>" +
          '<div class="exlist">' + body.slice(0, 2).join("") + "</div>";
        if (body.length > 2) {
          var more = el("button", "more", "Show all " + body.length);
          var open = false;
          more.addEventListener("click", function () {
            // Expands IN PLACE. The scroll position is restored around the
            // change, so the rows a teacher was reading do not move under them.
            var y = window.scrollY;
            open = !open;
            grp.querySelector(".exlist").innerHTML = (open ? body : body.slice(0, 2)).join("");
            more.textContent = open ? "Show fewer" : "Show all " + body.length;
            window.scrollTo(0, y);
          });
          grp.appendChild(more);
        }
        c.appendChild(grp);
      });
      if (warns.length) {
        var wg = el("div", "grp");
        wg.innerHTML = '<div class="grph"><span class="n">Worth checking, and not blocking</span>' +
          '<span class="c w">' + warns.length + "</span></div>" +
          '<p class="grpw">Recorded on the import and does not stop it.</p>' +
          warns.map(function (f) {
            return '<div class="ex"><span class="msg">' + esc(f.message) + "</span>" +
              '<span class="at">' + esc(f.code) + (f.path ? " · " + esc(f.path) : "") + "</span></div>";
          }).join("");
        c.appendChild(wg);
      }
      left.appendChild(c);
    });

    var right = el("div");
    var n = el("div", "card");
    var goers = okd.filter(function (r) { return !r.report.counts.error; });
    n.innerHTML = '<h2>Next</h2><p class="quiet">Resolve references checks that everything each ' +
      'package names already exists in the shared libraries.</p>' +
      '<p class="quiet">' + plural(goers.length, "package") + " continue" + (goers.length === 1 ? "s" : "") +
      ". " + (rejected.length ? plural(rejected.length, "package") + " stops here and stays visible." : "") + "</p>";
    var b = el("button", "btn primary", "Continue to Resolve references");
    b.id = "next"; b.disabled = !goers.length;
    var br = el("div", "btnrow"); br.appendChild(b); n.appendChild(br);
    right.appendChild(n);
    var cols = el("div", "cols"); cols.appendChild(left); cols.appendChild(right);
    s.appendChild(cols);
    $("#next").addEventListener("click", function () { go(3); });
    back(s, 1);
  }

  // 4 ------------------------------------------------------------------------
  function resolved(s) {
    $("#lede").textContent = "What each package names, and whether it is there. A reference that names " +
      "nothing is never matched to something similar.";
    var left = el("div");
    state.reports.filter(function (r) { return r.report && !r.report.counts.error; }).forEach(function (r) {
      var c = el("div", "card");
      var req = r.pkg.requires || {};
      var kinds = Object.keys(req).filter(function (k) { return (req[k] || []).length; });
      var total = kinds.reduce(function (n, k) { return n + req[k].length; }, 0);
      var blocked = r.report.findings.filter(function (f) { return f.severity === "blocked"; });
      c.innerHTML = "<h2>" + esc(r.report.package) + "</h2>" +
        '<p class="sub">' + (total ? plural(total, "reference") + " across " + plural(kinds.length, "library")
          : "This package names no shared record.") + "</p>" +
        (blocked.length ? '<div class="w"><span class="k same">-</span><span class="t">' +
          plural(blocked.length, "declared dependency", "declared dependencies") +
          " not in the library yet<small>The package is right and the library is not ready. " +
          "There is nothing to fix in the file.</small></span>" +
          '<span class="tag blockt">waiting</span></div>' : "") +
        kinds.map(function (k) {
          return row("same", k.charAt(0).toUpperCase() + k.slice(1) + ", " + plural(req[k].length, "record"),
            "all found");
        }).join("") +
        (total && !blocked.length ? '<div class="rule">Every reference resolved. Nothing was matched by ' +
          "resemblance: a reference is an id or it is a finding.</div>" : "");
      left.appendChild(c);
    });
    var right = el("div");
    var n = el("div", "card");
    n.innerHTML = '<h2>Next</h2><p class="quiet">Review changes is the first step that looks at your ' +
      'question bank. It shows exactly what publishing would add.</p>';
    var b = el("button", "btn primary", "Continue to Review changes");
    b.id = "next";
    var br = el("div", "btnrow"); br.appendChild(b); n.appendChild(br);
    right.appendChild(n);
    var cols = el("div", "cols"); cols.appendChild(left); cols.appendChild(right);
    s.appendChild(cols);
    $("#next").addEventListener("click", function () { go(4); });
    back(s, 2);
  }

  // 5 ------------------------------------------------------------------------
  // Everything on this screen is a field of the plan. Nothing is counted here.
  function review(s) {
    $("#lede").textContent = "Everything Publish would write, listed one by one. Nothing has been " +
      "written, and this build cannot write.";
    var p = state.plan;
    var ch = p.changes;
    var left = el("div");
    var sum = el("div", "card");
    sum.innerHTML = '<p class="count">' + (p.empty ? "<em>Nothing would be written</em>"
      : "<span>" + plural(ch.questionsAdded, "question") + "</span> would be added") + "</p>" +
      '<p class="sub">Checked against the ' + plural(p.checkedAgainst.questions, "question") +
      " this bank holds now.</p>" +
      row("add", plural(ch.questionsAdded, "question") + " added") +
      row("add", plural(ch.sharedAdded, "shared record") + " added") +
      // Same number, same meaning: the shared records the PUBLISHABLE questions
      // name. When nothing is publishable it is zero because there is nothing to
      // name them, and the line says which of those two it is.
      row("same", p.questions.length
        ? plural(ch.sharedReferenced, "existing shared record") + " used by the " +
          plural(p.questions.length, "publishable question")
        : "0 existing shared records used, because nothing here is publishable") +
      (ch.questionsHeld ? row("stop", plural(ch.questionsHeld, "question") + " cannot be published",
        "Ids already in the bank") : "") +
      (ch.packagesDeferred ? row("same", plural(ch.packagesDeferred, "package") + " waiting on the library") : "") +
      (ch.packagesRejected ? row("stop", plural(ch.packagesRejected, "package") + " not included",
        "Rejected at Validate") : "");
    left.appendChild(sum);

    var q = el("div", "card");
    q.innerHTML = "<h2>Questions</h2>" +
      '<p class="sub">Every question the import would add, and every one it cannot.</p>' +
      '<div class="grp"><div class="grph"><span class="n">New</span><span class="tag ' +
      (p.questions.length ? "good" : "neutral") + '">' +
      (p.questions.length ? String(p.questions.length) : "none") + "</span></div>" +
      (p.questions.length ? p.questions.map(function (x) {
        return row("add", x.id, "New question, from " + x.source);
      }).join("") : '<p class="grpw">No question in this import has an id that is free.</p>') + "</div>" +
      (p.held.length ? '<div class="grp"><div class="grph"><span class="n">Already exists</span>' +
        '<span class="tag badt">' + p.held.length + ", cannot publish</span></div>" +
        '<p class="grpw">An id already in the bank is import blocking and never an implicit overwrite. ' +
        "The existing questions stay exactly as they are.</p>" +
        p.held.map(function (h) {
          var why = h.reasons.filter(function (x) { return x.code === "QUESTION_ID_ALREADY_EXISTS"; })[0];
          return row("stop", h.id, why ? why.message : "");
        }).join("") + "</div>" : "");
    left.appendChild(q);

    if (p.rejected.length || p.deferred.length) {
      var ni = el("div", "card");
      ni.innerHTML = "<h2>Not included</h2>" +
        '<p class="sub">Still listed, so the set you chose does not appear to have shrunk.</p>' +
        p.rejected.map(function (r) {
          var why = r.reasons.filter(function (x) { return x.stage === "validate"; })[0];
          return row("stop", r.source || r.id, why ? why.message : "Rejected at Validate");
        }).join("") +
        p.deferred.map(function (d) { return row("same", d.source || d.id, "Waiting on the library"); }).join("") +
        state.reports.filter(function (r) { return !r.pkg; })
          .map(function (r) { return row("stop", r.source, "Could not be read: " + r.parseError); }).join("");
      left.appendChild(ni);
    }

    var inv = el("div", "invariant");
    inv.textContent = "Nothing has been written yet. Publish will perform exactly the additions shown " +
      "above and will not modify existing records.";
    left.appendChild(inv);

    var right = el("div");
    var n = el("div", "card");
    n.innerHTML = "<h2>What happens next</h2>" +
      '<p class="quiet">' + (p.empty ? "There is nothing to publish, so the next step has nothing to do."
        : "Publish performs the additions above and nothing else.") + "</p>";
    var b = el("button", "btn primary", "Continue to Publish");
    b.id = "next";
    // The enable rule, and the only place it is written: at least one publishable
    // addition. It is read from the plan, not recomputed.
    b.disabled = p.empty;
    var br = el("div", "btnrow"); br.appendChild(b); n.appendChild(br);
    right.appendChild(n);

    var marks = el("div", "card");
    marks.innerHTML = "<h2>What each mark means</h2>" +
      '<p class="quiet"><b>+ new.</b> Does not exist yet. Publish creates it.</p>' +
      '<p class="quiet"><b>= already exists.</b> Publish reads it and leaves it exactly as it is.</p>' +
      '<p class="quiet"><b>x not published.</b> Either the package was rejected, or its id is taken.</p>' +
      '<div class="rule">There is no fourth mark, because there is no overwrite.</div>';
    right.appendChild(marks);

    var readiness = p.entries.filter(function (e) { return e.publishable && e.capability; });
    if (readiness.length) {
      var rd = el("div", "card");
      rd.innerHTML = "<h2>Readiness is not a change</h2>" +
        readiness.map(function (e) {
          return '<p class="quiet"><b>' + esc(e.id) + "</b> reaches " +
            esc(String(e.capability.headline).split(" - ")[0].toLowerCase()) +
            (e.capability.missing.length ? " and does not reach " +
              plural(e.capability.missing.length, "capability", "capabilities") + ": " +
              esc(e.capability.missing.join(", ")) : "") + ".</p>";
        }).join("") +
        '<p class="quiet">None of that is a write, so none of it appears in the list on the left.</p>';
      right.appendChild(rd);
    }

    var cols = el("div", "cols"); cols.appendChild(left); cols.appendChild(right);
    s.appendChild(cols);
    $("#next").addEventListener("click", function () { go(5); });
    back(s, 3);
  }

  // 6 ------------------------------------------------------------------------
  // Publish. It receives the plan Review showed and never rebuilds one from the
  // files. Everything it can do is one of four outcomes from publish.apply(),
  // and the screen is a view of whichever came back.
  function publishStep(s) {
    $("#lede").textContent = state.result
      ? "What happened, in full."
      : "This step performs the additions you reviewed, and nothing else.";
    if (state.result) return publishResult(s);

    var p = state.plan;
    var left = el("div");
    var c = el("div", "card");
    c.innerHTML = '<p class="count"><span>' + plural(p.questions.length, "question") + "</span> will be added</p>" +
      '<p class="sub">The same publish set you reviewed, in short. Nothing here is new.</p>' +
      p.questions.map(function (x) { return row("add", x.id, "New question, from " + x.source); }).join("") +
      row("add", plural(p.shared.additions.length, "shared library record") + " added") +
      row("same", plural(p.checkedAgainst.questions, "existing question") + ", untouched") +
      '<div class="rule"><b>A package writes completely or not at all</b>, together with the shared ' +
      "records it provides. A batch is not atomic: if you publish several and one fails, the ones " +
      "already added stay added, and the result names which is which.</div>";
    left.appendChild(c);

    var right = el("div");
    var n = el("div", "card");
    n.innerHTML = "<h2>Ready</h2>" +
      '<p class="quiet">Checked against the ' + plural(p.checkedAgainst.questions, "question") +
      " in this bank. The check runs again as the first thing Publish does.</p>";
    var b = el("button", "btn primary", "Publish " + plural(p.questions.length, "question"));
    b.id = "publish";
    b.disabled = !p.questions.length || state.busy;
    var br = el("div", "btnrow"); br.appendChild(b); n.appendChild(br);
    right.appendChild(n);
    var cols = el("div", "cols"); cols.appendChild(left); cols.appendChild(right);
    s.appendChild(cols);

    b.addEventListener("click", function () {
      // GUARD FIRST, before anything is read or written. A second press during
      // an attempt, and a press on a button left over from a previous render,
      // both stop here. The flag is the guard rather than the disabled
      // attribute: the attribute is what a person sees, and an element held from
      // before the screen re-rendered still carries this listener while no
      // longer being in the document at all.
      if (state.busy || state.result) return;
      state.busy = true;
      // The element is the one this listener was attached to, so this cannot
      // throw on a screen that has since been replaced.
      b.disabled = true;
      b.textContent = "Publishing";
      // The destination is READ AGAIN, here, at the moment of writing. Reusing
      // the one Review was computed against would compare the plan with the bank
      // it was made from, so a question that arrived in between could never be
      // seen and the whole re-check would be theatre.
      state.result = C.apply(state.plan, C.store.destination(D.questions), {});
      state.busy = false;
      go(5);
    });
    back(s, 4);
  }

  function publishResult(s) {
    var r = state.result;
    var stale = r.outcome === C.OUTCOME.destinationChanged;
    var left = el("div");
    var banner = el("div", "banner " + (stale ? "warn" : r.added.length && !r.failed.length ? "good"
      : r.added.length ? "warn" : "stop"));
    banner.innerHTML = "<p class=\"hd\">" + esc(stale || !r.added.length ? "Nothing was written"
      : plural(r.added.length, "question") + " added") + "</p>" +
      '<p class="bd">' + esc(stale ? C.STALE
        : r.failed.length ? "Some packages could not be written. Nothing of them reached the bank."
        : "No existing question or shared record changed.") + "</p>";
    left.appendChild(banner);

    var c = el("div", "card");
    if (stale) {
      c.innerHTML = "<h2>What happened</h2>" +
        '<p class="sub">Publish checks the bank again as its first step. It did not match, so it ' +
        "stopped before writing anything.</p>" +
        row("same", "You reviewed against " + plural(r.reviewedAgainst, "question"),
          "The bank now holds " + r.destinationNow + ".") +
        (r.arrived || []).map(function (id) { return row("add", id + " was added since",
          "By something else, not by this import."); }).join("") +
        row("same", "0 questions written, 0 attempted", "Not a failed write. The write never began.");
    } else {
      c.innerHTML = "<h2>What was written</h2>" +
        r.added.map(function (a) {
          return row("add", a.id, "Stored whole" + (a.shared.length ? ", with " +
            plural(a.shared.length, "shared record") : "") + ".");
        }).join("") +
        r.failed.map(function (f) {
          return row("stop", f.id, f.reason + ". " + f.note);
        }).join("") +
        // Only when there is one. A row reading "0 packages was not in the
        // publish set" is noise with a grammar mistake in it.
        (r.held.length + r.rejected.length
          ? row("same", plural(r.held.length + r.rejected.length, "package") + " not in the publish set",
              "Unchanged, and never attempted.")
          : "") +
        '<div class="rule"><b>' + esc(r.atomicUnitSays) + "</b></div>";
    }
    left.appendChild(c);

    if (r.readiness && r.readiness.length && !stale) {
      var rd = el("div", "card");
      rd.innerHTML = "<h2>Worth doing next</h2>" +
        '<p class="sub">Reported apart from the writes, because none of it is a change.</p>' +
        r.readiness.map(function (x) {
          return '<p class="quiet"><b>' + esc(x.id) + "</b> " + esc(x.headline) +
            (x.warnings.length ? ". Warning: " + esc(x.warnings.join(", ")) : "") +
            (x.carried.length ? ". " + plural(x.carried.length, "field") +
              " stored without being interpreted: " + esc(x.carried.join(", ")) : "") + "</p>";
        }).join("");
      left.appendChild(rd);
    }

    var right = el("div");
    var n = el("div", "card");
    n.innerHTML = "<h2>What to do</h2>" +
      '<p class="quiet">' + esc(stale
        ? "Go back to Review. It will re-check your ids against the bank as it is now."
        : r.failed.length ? "Nothing was half done, so there is nothing to clean up."
        : "The questions above are in the bank and will still be there after a reload.") + "</p>";
    var brow = el("div", "btnrow");
    // RETRY IS A FRESH REVIEW, never a replay. It re-runs the pipeline against
    // the destination as it is now, which is why the button says Review and not
    // Publish again: pressing it can change what the plan says.
    var again = el("button", "btn primary", stale || r.failed.length ? "Review changes again" : "Import more");
    again.id = "again";
    brow.appendChild(again);
    n.appendChild(brow);
    n.innerHTML += '<p class="note">Attempt ' + esc(r.operation) + ". Retrying reviews again from the " +
      "start rather than sending this plan a second time.</p>";
    right.appendChild(n);
    var cols = el("div", "cols"); cols.appendChild(left); cols.appendChild(right);
    s.appendChild(cols);
    $("#again").addEventListener("click", function () {
      // A fresh admission against the live destination. The old plan and the old
      // result are dropped rather than reused.
      state.result = null;
      runPipeline();
      go(4);
    });
  }

  function back(s, to) {
    var row2 = el("div", "btnrow");
    var b = el("button", "btn", "Back");
    b.id = "back";
    b.addEventListener("click", function () { go(to); });
    row2.appendChild(b);
    s.appendChild(row2);
  }

  // ---- boot ----------------------------------------------------------------
  function boot() {
    if (!C || !D) {
      document.getElementById("screen").innerHTML =
        '<div class="card"><h2>The contract did not load</h2><p class="sub">The importer applies the ' +
        "contract modules and will not run without them, rather than falling back to rules of its own.</p></div>";
      return;
    }
    render();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  // Exposed for the test harness only. It reads state; it cannot change it.
  window.__importer = { state: function () { return state; }, go: go, take: take };
})();

</script>
</body>
</html>
